const DEEPRAW = `# "Tell me more": a deeper explanation and some background for bigger words. word|text (read aloud, so keep it plain).
epiphany|An epiphany is when an idea suddenly clicks, like a light switching on in your head. You might be stuck on a puzzle for ages, and then, aha! The word comes from an old Greek word that means "to show".
galaxy|Our galaxy is called the Milky Way. It has hundreds of billions of stars, and our Sun is just one of them. There are billions of other galaxies too, so many that no one can count them all.
gravity|Gravity is a pull that every object has. Big things like the Earth pull the hardest, which is why you fall down and not up. Gravity also keeps the Moon going round the Earth, and the Earth going round the Sun.
hurricane|A hurricane starts over warm ocean water. The storm spins faster and faster around a calm middle part called the eye. In some parts of the world the same kind of storm is called a cyclone or a typhoon.
tsunami|A tsunami starts when an earthquake shakes the sea floor. Out at sea the wave can be small, but as it reaches the shore it grows very tall. The word comes from Japanese and means "harbour wave".
avalanche|An avalanche happens when a big slab of snow breaks loose on a steep mountain. It can slide down faster than a car on the motorway. Mountain rescuers sometimes use dogs to find people buried in the snow.
glacier|A glacier is made from snow that piles up for hundreds of years and gets squashed into ice. It moves downhill very slowly and carves out valleys as it goes. New Zealand has glaciers too, like Fox and Franz Josef.
constellation|Long ago, people joined up stars with imaginary lines to make pictures, like a hunter or a bear. Sailors used them to find their way at night. In New Zealand you can see the Southern Cross, and Matariki, a cluster of stars that marks the Māori New Year.
eclipse|In a solar eclipse, the Moon passes between the Sun and the Earth and blocks the sunlight for a few minutes. In a lunar eclipse, the Earth's shadow falls on the Moon and it can turn a coppery red. Never look straight at the Sun, even during an eclipse.
meteor|Most meteors are tiny space rocks, no bigger than a grain of sand. They rush into our air so fast that they burn up and make a bright streak. People call them shooting stars, but they are not stars at all.
orbit|The Moon orbits the Earth about once a month. The Earth orbits the Sun once every year, and that is what a year is. Satellites that help phones and maps work are orbiting above us right now.
microscope|A microscope uses lenses to make tiny things look hundreds of times bigger. With one you can see the cells your body is made of, or tiny creatures in a drop of pond water. The first microscopes were made about 400 years ago.
experiment|Scientists use experiments to test their ideas. You make a guess about what will happen, try it, and watch carefully. A fair test changes just one thing at a time, so you know what made the difference.
skeleton|Your skeleton holds you up and protects the soft parts inside you; your skull protects your brain. A grown-up has 206 bones. Babies are born with even more, and some join together as they grow.
echo|An echo happens when sound bounces off something hard, like a cliff or a big empty hall, and comes back to your ears. Bats use echoes to find their way in the dark. In a Greek myth, Echo was a nymph who could only repeat the last words other people said.
marvellous|Marvellous comes from the word marvel, which means something that fills you with wonder. People say it about things that are wonderfully good, like a marvellous idea.
ridiculous|Something ridiculous is so silly it makes people laugh, like a cat wearing a top hat. It comes from an old Latin word that means "to laugh".
peculiar|Peculiar means strange, but in an interesting way. A peculiar noise makes you stop and wonder what it is.
minuscule|Minuscule is even smaller than tiny. It is also the name for small letters, the opposite of capital letters.
ferocious|A ferocious animal is fierce and ready to fight, like a tiger protecting its cubs. People can also have a ferocious appetite, which means they are very, very hungry.
mischievous|A mischievous person likes to play little tricks, like hiding someone's shoes. It is naughty, but usually in a fun way, not a mean way.
fascinating|When something is fascinating, you can't stop thinking about it. Wolves are fascinating because they live in families called packs and talk to each other with howls.
determined|Being determined means you keep going even when something is hard. Lots of famous inventors failed many times before they got it right, because they were determined.
confident|Being confident means you believe you can do something. You can feel confident and still be a bit nervous; that's normal. Practice makes people more confident.
grateful|Being grateful means noticing the good things you have and the kind things people do. Saying thank you is one way to show you are grateful.
jealous|Feeling jealous is normal. It happens when someone has something we want, like a new toy. It helps to talk about it, and to remember the good things you have too.
embarrassed|You feel embarrassed when you think people are looking at you after something silly, like tripping over. Your cheeks might go red. Everyone feels embarrassed sometimes, even grown-ups.
anxious|Feeling anxious is like having butterflies in your tummy. It can happen before something new, like a first day at school. Slow, deep breaths can help you feel calmer.
imagination|Your imagination lets you picture things that aren't in front of you, like a dragon or a castle in the clouds. Every story, invention and painting started in someone's imagination.
symmetry|Something has symmetry when you could fold it down the middle and both sides would match, like a butterfly's wings. Your face is nearly symmetrical too. Lots of buildings, flowers and snowflakes are symmetrical.
silhouette|A silhouette is the outline of something with no details inside, filled in dark, like your shadow on a wall. The word comes from a French man named Silhouette, who liked to make cheap paper portraits.
reflection|A reflection happens when light bounces off something smooth and shiny, like a mirror or a still lake. The other meaning is thinking back carefully about something, so you can learn from it.
lightning|Lightning is a giant spark of electricity that jumps between a cloud and the ground. It is hotter than the surface of the Sun. You see lightning before you hear thunder, because light travels much faster than sound.
thunder|Thunder is the sound lightning makes when it heats the air so fast that the air bursts outwards. If you count the seconds between the flash and the boom, you can tell how far away the storm is: about three seconds for every kilometre.
rainforest|Rainforests are home to more than half of all the kinds of animals and plants in the world. Some trees grow taller than a 15-storey building. The biggest rainforest is the Amazon in South America.
canyon|A canyon is carved by a river over millions of years, slowly wearing away the rock. The Grand Canyon in America is so deep you could stack five Eiffel Towers inside it.
archaeologist|Archaeologists dig carefully, sometimes with tiny brushes, to find things people left behind long ago, like pots, tools and bones. In 1922 archaeologists found the tomb of the young pharaoh Tutankhamun in Egypt, full of gold treasure.
sarcophagus|In ancient Egypt, a pharaoh's body was wrapped up as a mummy and placed inside a sarcophagus. It was often carved and painted with the person's face and with hieroglyphs. Some were nested inside each other, like Russian dolls.
papyrus|Papyrus is a tall reed that grows along the River Nile. The Egyptians cut it into strips, pressed them together and dried them to make a kind of paper. Our word "paper" comes from the word papyrus.
labyrinth|In a Greek myth, King Minos built a giant labyrinth to trap the Minotaur, a monster that was half man and half bull. A hero called Theseus found his way out by following a ball of thread.
champion|A champion is the winner of a competition. The other meaning is someone who stands up for something, like a champion for animals who works hard to protect them.
voyage|A voyage is a long journey, often across the sea. Long ago, Polynesian navigators made amazing voyages across the Pacific in waka, using the stars, the waves and the birds to find their way to Aotearoa.
explorer|Explorers travel to places that are new to them. Some explored oceans, mountains or the icy South Pole. Today, explorers also explore the deep sea and outer space.
cathedral|A cathedral is the main church of a city, and it is usually very big and grand. Some took more than a hundred years to build. Many have huge coloured windows called stained glass.
architect|An architect draws plans for buildings before they are built, a bit like a map for the builders. The architects of ancient Egypt planned the pyramids more than 4,000 years ago.
encyclopedia|An encyclopedia is a book, or a set of books, with facts about almost everything, in alphabetical order. Today many people use online encyclopedias instead.
vocabulary|Your vocabulary is all the words you know. Every word you learn in this game makes your vocabulary bigger. The more words you know, the more ways you have to say exactly what you mean.
philosopher|Philosophers ask big questions, like "What is fair?" or "How do we know what is true?". Socrates, Plato and Aristotle, from ancient Greece, are some of the most famous. Anyone who wonders about big questions is doing philosophy.
serendipity|Serendipity is a lucky surprise you weren't looking for. A medicine called penicillin, which has saved millions of lives, was found by serendipity when mould grew by accident on a scientist's dish.
extraordinary|Extraordinary means "extra" plus "ordinary": more than ordinary. It describes something so special that it stands out, like a wolf that can howl a whole song.
temperature|We measure temperature in degrees. Water freezes at 0 degrees Celsius and boils at 100 degrees. A healthy person's body is about 37 degrees.
peninsula|A peninsula sticks out into the sea, with water on three sides and land on one. New Zealand has lots of peninsulas, like the Coromandel.
earthquake|The Earth's outer layer is broken into giant pieces called plates that slowly move. When they suddenly slip, the ground shakes. New Zealand has lots of small earthquakes because it sits where two plates meet.
evaporate|When water gets warm, tiny bits of it float up into the air as an invisible gas. That's why puddles disappear on a sunny day. Later the gas cools down and makes clouds.
photosynthesis|Plants take in sunlight, water and a gas from the air called carbon dioxide, and turn them into sugar for food. As they do it, they give out oxygen, the gas we breathe. So every breath you take is thanks to plants.
oxygen|Oxygen is a gas in the air. You can't see it or smell it, but your body needs it every second. Plants and tiny sea creatures make most of the oxygen on Earth.
chrysalis|Inside the chrysalis, the caterpillar's body breaks down and rebuilds itself into a butterfly. This change is called metamorphosis. It can take one to two weeks.
herbivore|Herbivores eat only plants. Cows, rabbits, elephants and giraffes are herbivores. Many herbivores have flat teeth for grinding leaves.
carnivore|Carnivores eat meat. Wolves, lions and sharks are carnivores. They often have sharp teeth for biting and tearing.
omnivore|Omnivores eat both plants and animals. Bears, pigs and most people are omnivores. Their teeth are a mix of sharp and flat.
venom|Venom is a poison that some animals put in with a bite or a sting, like snakes, spiders and bees. They use it to catch food or to protect themselves. Scientists even use some venoms to make medicines.
pharaoh|Pharaohs were the kings, and sometimes queens, of ancient Egypt. People believed a pharaoh was part god. Famous pharaohs include Tutankhamun, Ramesses the Great and Cleopatra.
hieroglyph|Egyptian hieroglyphs are little pictures that stand for sounds or ideas, like an owl for the "m" sound. People forgot how to read them for over a thousand years, until a stone called the Rosetta Stone helped someone crack the code in 1822.
pyramid|The Great Pyramid of Giza was built for a pharaoh named Khufu about 4,500 years ago. It is made of over two million stone blocks, and it was the tallest building in the world for nearly 4,000 years.
myth|Myths are very old stories that people told to explain the world, like why the sun crosses the sky. Ancient Egyptians, Greeks and Romans, and Māori, all have their own myths about gods and heroes.
legend|A legend is an old story that might be partly true, like stories about King Arthur. People also call someone a legend if they are very famous for being great at something.
fossil|Fossils form when a plant or animal is buried in mud or sand, and over millions of years the mud turns to stone. Fossils tell us about dinosaurs and other creatures that lived long before people.
extinct|An animal is extinct when there are none left anywhere. Dinosaurs went extinct about 66 million years ago. In New Zealand, the giant moa went extinct about 600 years ago.
nocturnal|Nocturnal animals sleep in the day and come out at night. Owls, bats, kiwi and possums are nocturnal. Many have big eyes or great hearing to find their way in the dark.
predator|Predators hunt other animals for food. Wolves hunt together in packs, which lets them catch animals much bigger than one wolf, like elk or deer.
camouflage|Camouflage helps animals hide by matching what's around them. A chameleon can change colour, and a stick insect looks just like a twig. Soldiers wear camouflage clothes too.
migrate|Some birds migrate thousands of kilometres every year to find food and warmer weather. The bar-tailed godwit flies from Alaska to New Zealand without stopping, for more than a week.
hibernate|Animals that hibernate go into a very deep sleep for the winter, when food is hard to find. Their heartbeat and breathing slow right down. Bears, hedgehogs and some bats hibernate.
pack|A wolf pack is a family, usually a mum and dad wolf and their pups. They hunt, play and look after the pups together, and they howl to call each other and to tell other packs to stay away.
temple|In ancient Egypt, Greece and Rome, temples were built as homes for the gods, with statues inside. The other meaning is the flat side of your head, between your eye and your ear.
patient|Being patient means waiting calmly without getting cross, which can be hard! The other meaning is a person a doctor or nurse is looking after.
goddess|Ancient myths have many goddesses. Athena was the Greek goddess of wisdom, and Isis was an important Egyptian goddess who protected people. In Māori stories, Papatūānuku is the Earth Mother.
emperor|An emperor rules over an empire, which is many lands joined together. The Roman emperors ruled lands all around the Mediterranean Sea. Russia was also ruled by emperors, called tsars.
ancestor|Your ancestors are the people in your family who lived before you: your grandparents, their parents, and so on, going back hundreds of years. In Māori culture, knowing your whakapapa, your family line, is very important.
continent|There are seven continents: Africa, Antarctica, Asia, Australia, Europe, North America and South America. New Zealand sits on a mostly underwater continent called Zealandia.
gigantic|Gigantic comes from the word giant. In Greek myths, the Giants were huge beings who fought the gods of Mount Olympus.
ancient|Ancient means very old, often thousands of years. Ancient Egypt began about 5,000 years ago, long before cars, phones or even paper as we know it.
curious|Being curious means wanting to find out about things. Curious people ask lots of questions, and that's how scientists, explorers and inventors discover new things.
mysterious|Something mysterious is hard to explain, so it makes you wonder. The pyramids were mysterious for a long time, because no one knew exactly how they were built.
journey|A journey is a trip from one place to another, often a long one. Many stories are about a hero's journey, where the hero goes on an adventure and comes back changed.
invisible|Something invisible can't be seen. Air is invisible, and so are sounds. In stories, characters sometimes have a cloak or ring that makes them invisible.
# "Tell me more" for the base word list (word|text). Merged with deeper.txt by build.js.
the|"The" is the most used word in English! We use it when we mean one particular thing, like the moon or the dog next door.
and|"And" joins words and ideas together, like glue. You can use it to make a list: cats and dogs and wolves.
is|"Is" is a form of the word "be". We say "she is" and "it is", but "I am" and "they are".
it|"It" stands in for a thing so we don't have to say its name again: "Where is my book? I can't find it."
in|"In" tells you something is inside. Its opposite is "out".
on|"On" means touching the top of something. Its opposite is "off", like a light switch.
up|"Up" points to the sky. Lots of phrases use it: wake up, give up, cheer up, and hurry up!
go|"Go" is one of the oldest English words. Its past form is a surprise: today I go, yesterday I went.
to|"To" sounds just like "two" and "too", but each is spelled differently and means something different.
see|We see with our eyes, but people also say "I see" when they mean "I understand".
me|"Me" is how you talk about yourself when someone does something to you: "Throw the ball to me."
my|"My" shows something belongs to you: my book, my bed, my moon words.
we|"We" means me and at least one other person, like you and me together.
you|"You" is the person someone is talking to. It is the same whether you mean one person or lots of people.
he|"He" is used for a boy, a man, or a male animal.
she|"She" is used for a girl, a woman, or a female animal. Ships were often called "she" in old stories too.
can|"Can" means you are able to do something. It has a second meaning too: a metal tin for food.
cat|Cats have been friends with people for about 10,000 years. In ancient Egypt, cats were so special that some were made into mummies!
dog|Dogs are cousins of wolves. All pet dogs came from wolves that started living near people thousands of years ago.
pig|Pigs are very clever, smarter than many dogs. They roll in mud to keep cool because they can't sweat.
hat|People have worn hats for thousands of years: to keep warm, to keep the sun off, or to show who they are, like a king's crown.
sun|The Sun is a star so big that about a million Earths could fit inside it. Its light takes about 8 minutes to reach us.
bus|"Bus" is short for an old word, "omnibus", which means "for everyone".
cup|A cup is for drinking, but a gold cup is also a prize for winning, like a sports cup.
red|Red is the colour of fire trucks, strawberries and stop signs. People use red for warnings because it is easy to see.
blue|Blue is the colour of the sky and the sea. "Feeling blue" is a saying that means feeling sad.
green|Plants are green because of something in their leaves that helps them make food from sunlight.
yes|"Yes" is how we agree. Lots of people nod their head to say yes without any words.
no|"No" is one of the first words many babies learn! It sounds the same as "know", but means something different.
look|We look with our eyes. "Look out!" means be careful, and "look after" means take care of.
like|"Like" has two jobs: enjoying something, and saying two things are alike, like "she runs like the wind".
play|You can play a game, play music, or watch a play on a stage.
at|"At" tells you where or when: at home, at the park, at three o'clock.
am|"Am" only goes with "I": I am happy, I am eight.
get|"Get" is a busy word. You can get a present, get up, get better, or get lost!
got|"Got" is the past of "get": today I get, yesterday I got.
not|"Not" turns a sentence around: "It is cold" becomes "It is not cold".
but|"But" warns you that something different is coming: "I like cats, but not snakes."
all|"All" means every single one, with none left out.
with|"With" means together: "I play with my friend."
this|"This" points to something close to you. "That" points to something further away.
that|"That" points to something further away. "This" is for something close.
down|"Down" points towards the ground. Soft baby feathers are also called down.
out|"Out" means not inside. Its opposite is "in".
mum|"Mum" is what many people in New Zealand call their mother. In America they say "mom".
dad|"Dad" is short for "daddy". Other words for a father are "papa" and "pop".
home|Home is where you live, but it can also be any place where you feel safe and loved.
ball|Balls have been played with for thousands of years. A ball is also a fancy dance party, like in fairy tales.
said|"Said" is tricky: it sounds like "sed" but has "ai" in the middle. Writers also use words like "shouted", "whispered" or "giggled" instead.
was|"Was" is the past of "is": today it is sunny, yesterday it was sunny.
they|"They" means more than one other person or thing. It can also be used for one person when you don't know if they are a boy or a girl.
there|"There" means in that place. A trick: "there" has "here" inside it, and both are about places.
their|"Their" means it belongs to them. A trick: "their" has "heir" inside it, and an heir is someone who gets something.
were|"Were" is the past of "are": today we are at school, yesterday we were at the beach.
what|"What" starts lots of questions: What is that? What time is it? What does it mean?
when|"When" asks about time: When is your birthday?
where|"Where" asks about places: Where is my shoe? It has "here" inside it, just like "there".
which|"Which" asks you to choose: Which one do you want?
who|"Who" asks about a person: Who is at the door?
because|"Because" gives a reason. A spelling trick: Big Elephants Can Always Understand Small Elephants!
would|"Would" is used for wishes and polite questions: "Would you like some cake?"
could|"Could" is the past of "can", and also means maybe: "It could rain."
should|"Should" tells you the right thing to do: "You should wear a coat."
some|"Some" means a few, but not all.
come|"Come" means move towards here. Its past is "came".
want|"Want" means you would like to have something. Wanting is different from needing!
again|"Again" means one more time. "Again and again" means many times.
any|"Any" means even one: "Are there any biscuits left?"
many|"Many" means a lot of things you can count. For things you can't count, like water, we say "much".
does|"Does" is a form of "do": I do, she does.
goes|"Goes" is a form of "go": I go, he goes.
once|"Once" means one time. "Once upon a time" is how lots of fairy tales start.
only|"Only" means just one, or nothing more.
very|"Very" makes words stronger: big, very big, very very big!
every|"Every" means each one, with none left out: every day, every word.
before|"Before" means earlier. Its opposite is "after".
after|"After" means later. Its opposite is "before".
through|"Through" means in one side and out the other, like a tunnel. It sounds the same as "threw", which is about throwing.
thought|"Thought" is what happens when you think. It is also the past of "think".
enough|"Enough" means as much as you need. The "gh" at the end sounds like "f"!
also|"Also" means too, or as well.
know|"Know" starts with a silent "k". Long ago, people really did say the "k" sound!
heard|"Heard" is the past of "hear". It has "ear" inside it, which helps you remember the spelling.
might|"Might" means maybe. It also means great strength, like "with all his might".
built|"Built" is the past of "build". People built the pyramids over 4,000 years ago.
other|"Other" means a different one. "Each other" means two people doing something to one another.
people|"People" means more than one person. It has a funny spelling: p-e-o-p-l-e.
friend|A friend is someone you like who likes you back. A spelling trick: a friend is there to the "end".
laugh|Laughing is good for you! It relaxes your body and makes you feel happy. Even rats laugh when they are tickled.
great|"Great" means very good, but it can also mean very big, like the Great Wall of China.
eight|"Eight" sounds just like "ate". An octopus has eight arms and a spider has eight legs.
school|"School" comes from an old Greek word for free time spent learning. A big group of fish is also called a school.
house|People have built houses from mud, wood, stone, snow and even paper!
water|Most of your body is water, and so is most of the Earth's surface. You can't live more than a few days without drinking it.
write|"Write" starts with a silent "w". It sounds just like "right".
buy|"Buy" sounds the same as "by" and "bye". You buy things with money.
little|"Little" means small. "A little" also means a bit, like "a little tired".
answer|"Answer" has a silent "w" in the middle: a-n-s-w-e-r.
different|Everyone is different. Things that are different are not the same.
learn|Your brain grows new connections every time you learn something.
world|The world has about 8 billion people living on it, speaking over 7,000 languages.
together|"Together" means with each other. A spelling trick: to-get-her.
light|Light is the fastest thing there is. It could go around the Earth more than 7 times in one second!
right|"Right" means correct, or the side opposite left. It sounds the same as "write".
always|"Always" means every time, with no exceptions.
never|"Never" means not even once. "Never ever" means really, really never!
sometimes|"Sometimes" is made of two words: some and times.
watch|You can watch a show, or wear a watch on your wrist to tell the time.
young|"Young" means not old. Baby animals are called young too.
busy|"Busy" is spelled with a "u" but sounds like "bizzy". Bees are famous for being busy.
pretty|"Pretty" means nice to look at, but "pretty good" means quite good.
quiet|"Quiet" and "quite" look alike but are different. Quiet means not loud.
early|"Early" means before the usual time. "The early bird catches the worm" is a saying.
half|"Half" has a silent "l". Two halves make one whole.
island|"Island" has a silent "s". New Zealand is two big islands and lots of little ones.
sure|"Sure" means certain. "Sure!" is also a friendly way of saying yes.
favourite|Your favourite is the one you like best. In New Zealand we spell it with a "u"; Americans spell it "favorite".
special|"Special" means not like the others. Everyone is special in their own way.
idea|An idea is a thought or a plan. Every invention and story started as an idea.
colour|Rainbows show all the colours of light: red, orange, yellow, green, blue, indigo and violet.
noodle|Noodles were first made in China about 4,000 years ago! "Use your noodle" is a funny way of saying "use your brain".
astronaut|"Astronaut" comes from Greek words meaning "star sailor". Astronauts float in space because they are falling around the Earth.
dinosaur|"Dinosaur" means "terrible lizard". Birds are actually living dinosaurs!
planet|There are eight planets going around our Sun. "Planet" comes from a Greek word meaning "wanderer", because planets seem to wander across the sky.
computer|The first computers were as big as a room. Now a phone is a computer that fits in your pocket.
sandwich|The sandwich is named after the Earl of Sandwich, who liked to eat meat between bread so he could keep playing cards.
spaghetti|"Spaghetti" is Italian for "little strings". It is one of hundreds of shapes of pasta.
pizza|Pizza comes from Italy. The Margherita pizza has red tomato, white cheese and green basil, the colours of the Italian flag.
caterpillar|A caterpillar eats and eats, then makes a chrysalis and turns into a butterfly or moth.
garden|People grow food and flowers in gardens. A garden can be big or small, even a pot on a windowsill.
story|People have told stories for as long as there have been people. Stories help us remember, imagine and learn.
author|An author is someone who writes a book. You are the author of the stories you write!
poem|A poem plays with the sound and rhythm of words. Some rhyme and some don't.
rhyme|Words rhyme when they end with the same sound, like moon, spoon and June. Many songs and poems use rhyme.
chapter|Long books are split into chapters so you can read them bit by bit.
add|When you add, you put numbers together to make a bigger number. The sign for add is +.
subtract|Subtracting means taking away. Its sign is -, called "minus".
multiply|Multiplying is a quick way of adding the same number again and again. 3 x 4 means three lots of four, which is 12.
divide|Dividing means sharing equally. 12 divided by 3 means sharing 12 into 3 equal groups of 4.
equal|"Equal" means the same amount. The sign = means "equals".
number|Numbers help us count and measure. Zero was a very important invention!
shape|Shapes are everywhere: circles, triangles, squares and lots more.
circle|A circle is perfectly round. Every point on its edge is the same distance from the middle.
triangle|A triangle has three sides and three corners. Triangles are very strong, so builders use them in bridges and roofs.
square|A square has four equal sides and four square corners. A town square is an open space in the middle of a town.
measure|We measure length with rulers, weight with scales, and time with clocks.
money|Long ago, people traded shells, salt and even giant stones as money!
coin|Coins have been used for about 2,700 years. New Zealand coins have pictures like a kiwi and a tuatara.
price|The price is how much you pay. The same thing can have different prices in different shops.
spend|When you spend money, you use it to buy something. You can spend time too.
save|Saving money means keeping it for later. "Save" also means rescuing someone from danger.
beach|Beach sand is tiny bits of rock and shell, ground down by the waves over a very long time.
library|"Library" comes from the Latin word for book. Some libraries lend toys, tools and even seeds!
birthday|On your birthday you turn one year older. People celebrate in different ways all around the world.
breakfast|"Breakfast" means breaking your fast, because you haven't eaten all night.
holiday|"Holiday" comes from "holy day", because long ago days off were special religious days.
one|"One" sounds like "won". It is the very first counting number.
two|"Two" has a silent "w". Twins, twice and twenty all come from the same family of words.
three|Lots of stories have threes: three little pigs, three bears, three wishes.
four|"Four" sounds like "for". Most animals with legs walk on four of them.
five|You have five fingers on each hand, which is probably why people count in tens.
six|Insects have six legs. Honeycomb cells have six sides.
seven|There are seven days in a week and seven colours in a rainbow.
nine|Nine is the biggest number with just one digit.
ten|We count in tens because we have ten fingers. Ten tens make a hundred.
eleven|"Eleven" comes from an old word meaning "one left over" after counting to ten.
twelve|There are twelve months in a year and twelve hours on a clock face.
twenty|Twenty means two tens.
hundred|A hundred is ten tens. A century is a hundred years.
thousand|A thousand is ten hundreds. A millipede is said to have a thousand legs, but most have far fewer!
million|A million is a thousand thousands. If you counted one number every second, it would take about 12 days to reach a million.
wolf|Wolves live in families called packs. They can hear sounds kilometres away and talk to each other with howls.
moon|The Moon goes round the Earth about once a month, and the same side of it always faces us.
star|Stars are giant balls of burning gas, very far away. The Sun is our nearest star.
tree|Trees give us oxygen to breathe. Some trees live for thousands of years.
mountain|The tallest mountain on Earth is Mount Everest. New Zealand's tallest is Aoraki Mount Cook.
river|Rivers start high up, often from rain or melting snow, and flow down to the sea.
rain|Rain is water falling from clouds. It can fall as tiny drizzle or big heavy drops.
snow|Every snowflake has six sides, and no two are exactly the same.
cloud|Clouds are made of billions of tiny water drops or ice crystals floating in the sky.
flower|Flowers make seeds. Their bright colours and smells bring bees and birds to help them.
rainbow|A rainbow appears when sunlight shines through raindrops. You can only see one with the sun behind you.
volcano|A volcano is an opening in the Earth where hot melted rock called lava comes out. Auckland is built on about 50 old volcanoes!
desert|A desert gets very little rain. Antarctica is the biggest desert in the world, because it hardly ever rains or snows there.
leaf|Leaves make food for the plant from sunlight. In autumn some leaves change colour and fall.
rock|Rocks are made over millions of years. Some form from lava, some from layers of sand pressed together.
fire|Fire needs three things: fuel, heat and oxygen. Take one away and it goes out.
ocean|Oceans cover most of the Earth. The deepest part is deeper than Mount Everest is tall.
storm|Storms bring strong winds, heavy rain, thunder and lightning.
horse|Horses can sleep standing up. People have ridden horses for thousands of years.
rabbit|Rabbits' teeth never stop growing, so they chew a lot to keep them short.
snake|Snakes smell with their tongues. New Zealand has no land snakes at all!
eagle|Eagles can spot a rabbit from more than a kilometre away. Their eyesight is much sharper than ours.
owl|Owls can turn their heads almost all the way around. They fly silently to catch mice at night.
bear|Bears can smell food from very far away. To "bear" something also means to put up with it.
fox|Foxes are cousins of wolves and dogs. Some use the Earth's magnetism to help them pounce on mice!
deer|Male deer grow antlers, which fall off and grow back every year.
whale|The blue whale is the biggest animal that has ever lived, bigger than any dinosaur.
shark|Sharks have been around for over 400 million years, longer than trees!
octopus|An octopus has eight arms, three hearts and blue blood. It can change colour to hide.
turtle|Sea turtles swim thousands of kilometres and come back to the beach where they hatched to lay their eggs.
frog|Frogs drink water through their skin. A baby frog is called a tadpole.
butterfly|Butterflies taste with their feet! They start life as caterpillars.
spider|Spiders are not insects; they have eight legs. Their silk is stronger than steel of the same thickness.
elephant|Elephants are the biggest land animals. They use their trunks to drink, smell, hug and say hello.
giraffe|Giraffes are the tallest animals. Their tongues are dark blue and about half a metre long.
camel|Camels store fat, not water, in their humps. They can go for days without drinking.
crocodile|Crocodiles have been around since the time of the dinosaurs. They can't stick out their tongues.
penguin|Penguins are birds that can't fly but are amazing swimmers. New Zealand has more kinds of penguin than anywhere else.
kangaroo|Kangaroos can't walk backwards. A baby kangaroo, called a joey, lives in its mum's pouch.
zebra|Every zebra's stripes are different, like a fingerprint.
tiger|Tigers are the biggest cats. Unlike most cats, they love swimming.
monkey|Monkeys live in groups and talk using calls, faces and body language.
parrot|Some parrots can copy human words. New Zealand's kākāpō is a parrot that can't fly.
sheep|New Zealand has about five sheep for every person!
goat|Goats are great climbers. Some climb trees and steep cliffs.
chicken|Chickens are the closest living relatives of Tyrannosaurus rex!
duck|Ducks have waterproof feathers. To "duck" also means to bend down quickly.
squirrel|Squirrels bury nuts to eat later and forget where some are, which helps new trees grow.
hedgehog|A hedgehog rolls into a spiky ball when it is scared. Each one has thousands of spines.
bat|Bats are the only mammals that can truly fly. New Zealand's only native land mammals are bats.
swan|Swans often stay with the same partner for life. Black swans live in New Zealand and Australia.
dolphin|Dolphins are clever mammals that breathe air. They call each other with their own whistle names.
snail|Snails carry their shell homes on their backs and leave a slimy trail to help them slide.
book|The first books were written by hand, so each one took a very long time to make.
pencil|Pencil "lead" is really graphite. One pencil can draw a line about 56 kilometres long!
scissors|Scissors are always talked about as a pair, even though they are one tool.
clock|Before clocks, people told the time using the sun, sand timers and candles.
key|A key opens a lock. Keys on a piano or keyboard are the parts you press.
door|Doors can swing, slide, spin or fold. Some old castle doors were so heavy it took many people to open them.
window|"Window" comes from old words meaning "wind eye": a hole to let in air and light.
chair|Most chairs have four legs, but some have three, one, or rock on curved legs.
bed|We spend about a third of our lives in bed, sleeping.
spoon|Spoons are one of the oldest tools for eating. Long ago they were made from shells and wood.
bread|People have baked bread for over 10,000 years. Yeast makes bread rise and go fluffy.
cheese|There are more than a thousand kinds of cheese, all made from milk.
apple|There are thousands of kinds of apple. A seed from an apple grows into a tree with quite different apples!
banana|Bananas grow in bunches called hands, and each banana is called a finger!
carrot|Carrots used to be purple! Orange carrots came later.
egg|Birds, reptiles, fish and even a couple of mammals lay eggs.
milk|Mammals feed their babies milk. People drink milk from cows, goats, sheep and even camels.
honey|Bees make honey from flower nectar. Honey never goes off; honey found in Egyptian tombs could still be eaten!
cake|People have baked cakes for celebrations for thousands of years.
castle|Castles were built as strong homes to keep people safe. Some had moats, which are ditches full of water.
bridge|Bridges help us cross rivers and valleys. The longest bridge in the world is over 160 kilometres long.
train|Trains run on tracks. To "train" also means to practise to get better at something.
boat|People have used boats for tens of thousands of years. Polynesian voyagers sailed waka all the way to Aotearoa.
plane|The Wright brothers flew the first plane in 1903. It only stayed up for 12 seconds!
rocket|A rocket pushes hot gas out the bottom, and that pushes the rocket up into space.
bicycle|"Bicycle" means "two wheels". There are about twice as many bicycles in the world as cars.
tent|A tent is a home you can carry. Some people in deserts and grasslands live in tents all year.
crown|A crown is worn by a king or queen. The top of your head is also called your crown.
umbrella|"Umbrella" comes from a Latin word meaning "little shade". The first ones kept off the sun, not the rain.
shoe|The oldest shoe ever found is about 5,500 years old, made of leather.
glasses|Glasses help people see clearly. Glasses are also cups made of glass.
kite|Kites were invented in China more than 2,000 years ago. Some were big enough to lift a person!
balloon|Balloons float when they are filled with a gas lighter than air, like helium.
gift|A gift is something you give without asking for anything back. A gift can also be a talent, like a gift for drawing.
candle|Before electric lights, people used candles to see at night.
bell|Bells ring when they are hit. Big church bells can be heard kilometres away.
drum|Drums are one of the oldest instruments. People have used them to send messages over long distances.
map|Maps are drawings of places from above. Old maps sometimes had dragons drawn in unknown places!
telescope|A telescope makes far-away things look closer. Galileo used one to discover moons around Jupiter.
magnet|A magnet pulls iron and steel towards it. The Earth itself is a giant magnet, which is why compasses work.
hand|Your hand has 27 bones. To "hand" someone something means to give it to them.
foot|Your foot has 26 bones. A foot is also a measure of length, about 30 centimetres.
ear|Your ears help you hear and keep your balance. The smallest bones in your body are inside your ears.
nose|Your nose can tell apart a huge number of different smells, maybe more than a trillion!
tooth|Tooth enamel is the hardest thing in your body. Children have 20 baby teeth.
heart|Your heart beats about 100,000 times every day, pumping blood around your body.
king|A king rules a country. In chess, the game ends when the king is trapped.
queen|A queen can rule a country. In a beehive, the queen bee lays all the eggs.
baby|Babies are born with about 300 bones; some join together as they grow, leaving 206.
robot|"Robot" comes from a Czech word meaning "work". Robots build cars and even explore Mars.
ghost|Ghosts are spooky spirits in stories. They aren't real, but they make great tales around a campfire.
dragon|Dragons appear in stories all over the world. In Chinese stories, dragons bring good luck and rain.
unicorn|A unicorn is a magical horse with one horn. It is Scotland's national animal!
sword|Long ago, knights and samurai carried swords. Making a good sword took great skill.
shield|A shield protects you. Many shields were painted with a family's special symbol.
compass|A compass needle always points north, because of the Earth's magnetism.
run|People are some of the best long-distance runners in the animal world.
swim|Some animals are born knowing how to swim, but people have to learn.
climb|Climbing uses your hands and feet. Some people climb huge rock walls for fun.
dance|Every culture in the world has its own dances, like the haka in Aotearoa.
sleep|Children need about 10 hours of sleep. Your brain sorts out what you learned while you sleep.
cry|Crying can help you feel better. Tears also keep your eyes clean.
smile|Smiling can make you feel happier, and smiles are catching!
listen|Listening is more than hearing. It means paying attention to what you hear.
hide|Hide-and-seek is played all around the world. Animals hide using camouflage.
build|Builders follow plans called blueprints to build houses and bridges.
cook|Cooking makes food safe and tasty. People started cooking with fire hundreds of thousands of years ago.
paint|Long ago, paint was made from crushed rocks, plants and even insects.
sing|Singing makes your brain release happy chemicals. Birds sing to talk to each other.
throw|People are some of the best throwers in the animal kingdom.
catch|You catch a ball with your hands. You can also catch a cold, or catch a bus.
carry|Ants can carry things many times heavier than their own bodies.
whisper|A whisper is speaking using only your breath, not your voice.
shout|Shouting is useful for calling someone far away, but not so nice indoors!
howl|Wolves howl to call their pack together and to tell other wolves "this is our home".
think|Thinking happens in your brain, which uses about a fifth of all your body's energy.
remember|Your brain remembers things better if you sleep, practise, and connect them to things you already know.
big|"Big" has bigger cousins: huge, enormous, gigantic and tremendous.
huge|"Huge" means very big. A blue whale is huge.
tiny|"Tiny" means very small. An ant is tiny. Even tinier is "minuscule"!
fast|The cheetah is the fastest land animal. "Fast" can also mean going without food for a while.
slow|Sloths are so slow that tiny plants grow in their fur.
hot|Some deserts get hotter than 50 degrees. "Hot" can also mean spicy.
cold|The coldest place on Earth is Antarctica. "A cold" is also a sniffly illness.
wet|Water makes things wet. Ducks stay dry because their feathers are waterproof.
dry|"Dry" means without water. Deserts are the driest places.
soft|Soft things squash easily, like a pillow or a puppy's fur.
loud|Sound is measured in decibels. A rocket launch is one of the loudest sounds people make.
happy|Being happy is a feeling, and it can be catching! Smiling at someone can make them happy too.
sad|Feeling sad is normal. Talking to someone you trust can help you feel better.
angry|Everyone feels angry sometimes. Taking deep breaths can help the feeling pass.
scared|Feeling scared helps keep us safe. Being brave is doing something even when you feel scared.
tired|When you are tired, your body needs rest. Yawning may help wake your brain up.
hungry|Your tummy rumbles when you're hungry because your stomach muscles are squeezing.
brave|Being brave doesn't mean not being scared. It means doing the right thing even when you are.
kind|Being kind means caring about others. "Kind" also means a type, like "what kind of dog?".
clever|There are lots of ways to be clever: with words, numbers, music, drawing, or people.
funny|"Funny" means it makes you laugh. It can also mean strange, like "a funny smell".
dark|It gets dark at night because your side of the Earth has turned away from the Sun.
bright|"Bright" means full of light. A bright person is clever.
heavy|Heavy things are hard to lift. A blue whale's tongue weighs about as much as an elephant!
empty|"Empty" means nothing inside. The opposite is full.
full|"Full" means no room left. "Full of beans" is a saying that means full of energy.
sharp|Sharp things can cut. A sharp person notices things quickly.
sticky|Sticky things stick to you, like honey or glue. Geckos have special feet that let them walk up walls.
old|The oldest living trees are almost 5,000 years old.
near|"Near" means close by. The opposite is far.
far|The farthest thing people have sent into space is a spacecraft called Voyager 1.
deep|The deepest part of the ocean is about 11 kilometres down.
strong|"Strong" means having lots of power. Ants are very strong for their size.
forest|Forests are home to most land animals and plants. New Zealand forests are full of birds like the tūī and kererū.
metaphor|Writers use metaphors to paint pictures in your mind. "Time is a thief" means time takes things away from us.
simile|Similes use "like" or "as". "As brave as a lion" and "ran like the wind" are similes.
foreshadowing|Foreshadowing is when a writer drops a hint about what will happen later, like dark clouds before a storm.
character|Characters can be people, animals, or even objects that talk. Good characters want something and change during the story.
plot|The plot is the order of events in a story: the beginning, the problem, the exciting part, and the ending.
setting|The setting is where and when a story happens, like a castle long ago or a spaceship in the future.
narrator|The narrator is the voice telling the story. Sometimes the narrator is one of the characters.
villain|The villain is the bad character in a story. A good villain makes the hero's journey exciting.
alliteration|Alliteration is when words start with the same sound, like "Peter Piper picked a peck of pickled peppers".
fable|Fables are short stories that teach a lesson. Aesop's fables are over 2,500 years old.
fiction|Fiction is made-up stories. Non-fiction is about true things.
dialogue|Dialogue is what characters say. In books it goes inside speech marks.
climax|The climax is the most exciting part of a story, where the big problem comes to a head.
illustrator|An illustrator draws the pictures for a book. Some authors are illustrators too.
tornado|Tornado winds can spin faster than 300 kilometres an hour.
universe|The universe is everything: all the stars, planets and galaxies. Nobody knows how big it really is.
satellite|The Moon is Earth's natural satellite. There are thousands of machine satellites too, helping with phones, weather and maps.
comet|Comets are sometimes called "dirty snowballs". Their tails always point away from the Sun.
hypothesis|A hypothesis is a guess that can be tested. Scientists test their hypotheses with experiments.
energy|Energy can't be made or destroyed, only changed from one kind to another, like from food into movement.
scientist|Scientists ask questions about the world and test their ideas carefully. Anyone curious can think like a scientist!
fraction|A fraction is part of a whole. One half, written 1/2, means one of two equal parts.
estimate|To estimate is to make a careful guess. Estimating helps you check if an answer makes sense.
budget|A budget is a plan for your money, so you know how much to spend and how much to save.
profit|Profit is the money a business has left after paying for everything.
gorgeous|"Gorgeous" means very beautiful. It comes from an old French word.
nimble|"Nimble" means quick and light. A nimble gymnast moves easily.
timid|"Timid" means shy and easily scared, like a mouse.
gloomy|"Gloomy" means dark and a bit sad, like a grey rainy day.
cosy|"Cosy" means warm and comfortable. In America they spell it "cozy".
hilarious|"Hilarious" means extremely funny, so funny you can't stop laughing.
excited|Excited is the bubbly feeling you get before something great, like a birthday.
pattern|Patterns repeat. You can find them in maths, music, nature and art.
shadow|A shadow forms when something blocks light. Your shadow is longest in the early morning and evening.
dazzling|"Dazzling" means so bright it's hard to look at, like sunlight on snow.
shimmer|To shimmer is to shine with a soft, wobbly light, like moonlight on water.
murmur|A murmur is a soft, low sound of voices, or of a stream.
waterfall|The tallest waterfall in the world is Angel Falls in Venezuela, nearly a kilometre high.
expedition|An expedition is a journey with a goal, like climbing a mountain or exploring the South Pole.
invention|Inventions change the world. The wheel, the printing press and the phone were all inventions.
ingredients|Ingredients are the things you mix to make food. A recipe tells you which ingredients you need.
delicious|"Delicious" means tasting really good. Everyone has different favourite delicious foods.
alphabet|The English alphabet has 26 letters. "Alphabet" comes from the first two Greek letters: alpha and beta.
paragraph|A paragraph is a group of sentences about one idea. A new paragraph starts on a new line.
question|A question asks for an answer and ends with a question mark. Asking questions is how we learn.
opinion|An opinion is what you think. Different people can have different opinions, and that's OK.
mystery|A mystery is something no one can explain yet. Mystery stories are about solving puzzles.
evidence|Evidence is the clues that show something is true. Detectives and scientists both look for evidence.
detective|Detectives solve mysteries by looking for clues. Sherlock Holmes is a famous story detective.
tremendous|"Tremendous" means very big or very great, like a tremendous roar.
spectacular|"Spectacular" means amazing to look at, like fireworks.
ordinary|"Ordinary" means normal, nothing special. Extraordinary means more than ordinary.
impossible|"Impossible" means it cannot happen. But many things people once thought impossible, like flying, are real now.
necessary|"Necessary" means needed. A spelling trick: one collar (c) and two socks (ss).
thermometer|A thermometer measures how hot or cold something is.
dissolve|When sugar dissolves in water, it breaks into pieces too tiny to see, but it's still there. You can taste it!
tadpole|Tadpoles live in water and breathe through gills. Slowly they grow legs and lose their tails to become frogs.
enormous|"Enormous" means really, really big, like a blue whale.
furious|"Furious" means very, very angry. It is stronger than cross.
delighted|"Delighted" means very happy and pleased.
exhausted|"Exhausted" means very, very tired, like after a long run.
prey|Prey is an animal hunted by another. Rabbits are prey for foxes and eagles.
habitat|A habitat is the natural home of an animal or plant, like a forest, a river or the sea.
hero|A hero is someone brave who helps others. Heroes can be in stories or in real life.
discover|To discover is to find something for the first time, like explorers finding new lands.
imagine|To imagine is to make pictures in your mind. Every invention starts with someone imagining it.
brilliant|"Brilliant" means very bright, very clever, or very good.
terrible|"Terrible" means very bad. It comes from an old word meaning "frightening".
magnificent|"Magnificent" means grand and beautiful, like a castle or a sunset.
fragile|"Fragile" means easy to break. Parcels with glass inside are marked "fragile".
transparent|"Transparent" means you can see through it, like glass or clear water.
silent|"Silent" means no sound at all. "Silent" and "listen" use the very same letters!
swift|"Swift" means very fast. A swift is also a bird that can keep flying for months without landing.
cunning|"Cunning" means clever at tricking others. In fables, the fox is often cunning.
loyal|"Loyal" means you stick by someone. Dogs are famous for being loyal.
generous|"Generous" means happy to share and give.
courage|Courage is being brave when you are scared.
adventure|An adventure is an exciting experience, often a journey to new places.
treasure|Treasure is gold, jewels, or anything very precious to you.
puzzle|A puzzle is a problem you solve by thinking. Jigsaws, riddles and crosswords are puzzles.
tomb|A tomb is a burial place. Egyptian pharaohs had grand tombs filled with treasure.
oasis|An oasis is a spot in the desert with water and plants. Travellers with camels stop there to rest.
statue|A statue is a figure made of stone, metal or wood. The Statue of Liberty is one of the most famous.
symbol|A symbol stands for something else. A heart can mean love, and a red cross can mean help.
invent|To invent is to make something new that nobody made before.
den|A den is a wild animal's home, like a wolf's den where pups are born.
frozen|"Frozen" means turned to ice. Water freezes at zero degrees Celsius.
blizzard|A blizzard is a snowstorm with strong winds, so you can barely see.
guitar|Most guitars have six strings. You change the notes by pressing the strings against the neck while you strum or pluck.
# "Tell me more" for the "Next 500 most-used words" pack (word|text)
of|"Of" is one of the most used words in English. It links things together: a cup of tea, the top of the hill, a friend of mine.
for|"For" sounds the same as "four" but means "meant for someone", like a gift for you.
are|"Are" is a form of "be" that goes with you, we and they: you are, we are, they are.
as|"As" is used in comparisons: as big as a bus, as quiet as a mouse.
his|"His" means it belongs to him. "Hers" means it belongs to her.
be|"Be" is a special word that changes a lot: I am, you are, she is, we were, they have been.
have|"Have" means owning or holding. It also helps make other words: "I have finished."
from|"From" tells where something started: a letter from Nan, a wolf from the forest.
or|"Or" gives a choice: tea or juice? Left or right?
had|"Had" is the past of "have": today I have a cold, last week I had a cold.
by|"By" sounds like "buy" and "bye". It means next to, or done by someone: a book by my favourite author.
word|There are more than a million words in English, but most people use about 20,000.
use|"Use" can rhyme with "fuse" when it's doing, and "juice" when it's a thing: "What's the use?"
an|"An" goes before words that start with a vowel sound: an apple, an owl, an hour.
each|"Each" means every one, taken one at a time.
do|"Do" is a busy helper word: Do you like it? I do!
how|"How" asks about the way something happens: How do birds fly?
if|"If" sets up a maybe: If it rains, we'll stay inside.
will|"Will" talks about the future: I will help tomorrow. A will is also a paper saying who gets your things.
then|"Then" means after that. Don't mix it up with "than", used for comparing.
them|"Them" means those people or things: "I gave them a wave."
these|"These" points to things close by. "Those" points to things further away.
so|"So" can mean very, or "that's why": I was tired, so I went to bed.
her|"Her" is used for a girl or woman: I saw her, and that is her bag.
make|"Make" means to create. Its past is "made".
him|"Him" is used for a boy or man: I helped him.
into|"Into" shows moving inside: The wolf ran into the forest.
time|People measure time in seconds, minutes, hours, days and years. Clocks were invented to keep track of it.
has|"Has" goes with he, she and it: she has a dog.
more|"More" means a bigger amount. "Less" is the opposite.
way|A way can be a path, or how to do something: the way to school, a clever way to remember.
than|"Than" is used for comparing: a wolf is bigger than a fox.
first|"First" means before all the others. The first person on the Moon was Neil Armstrong.
been|"Been" is a form of "be": I have been to the zoo.
call|You can call someone's name, or call them on the phone.
now|"Now" means at this very moment.
find|"Find" means discover where something is. Its past is "found".
long|"Long" measures from end to end. The longest snake can grow longer than a car.
day|A day is the time the Earth takes to spin around once, about 24 hours.
did|"Did" is the past of "do": today I do my homework, yesterday I did it.
made|"Made" is the past of "make". It sounds like "maid".
may|"May" means might, or that you're allowed. May is also the name of a month.
part|A part is a piece of something bigger, like a part of a puzzle.
over|"Over" means above, or finished: The game is over.
take|"Take" means pick up or carry away. Its past is "took".
work|Work can be a job, or trying hard at something. Homework is school work you do at home!
place|A place is a spot where something is. "First place" means the winner.
year|A year is how long the Earth takes to go around the Sun: about 365 days.
live|To live means to be alive, or to have your home somewhere.
back|Your back is behind you. "Come back" means return.
give|"Give" means hand something to someone. Its past is "gave".
most|"Most" means the biggest amount, or nearly all.
thing|"Thing" is a word for any object you can name, or don't know the name of!
our|"Our" means it belongs to us.
just|"Just" means only, or a moment ago. A just person is fair.
name|Every person, pet and place has a name. Your name is often the first word you learn to write.
good|"Good" has better and best: good, better, best.
sentence|A sentence starts with a capital letter and ends with a full stop, question mark or exclamation mark.
man|"Man" changes to "men" when there's more than one.
say|"Say" means speak words. Its past is "said".
help|Helping others makes them feel good, and you too.
much|"Much" is used for things you can't count, like much water or much noise.
line|A line is a long thin mark. You can also stand in a line, or say your lines in a play.
too|"Too" means also, or very: Me too! It's too hot!
mean|"Mean" is what a word is about. It can also mean unkind, or the middle number in maths.
same|"Same" means not different. The opposite is different.
tell|"Tell" means say something to someone. Its past is "told".
boy|A boy grows up to be a man.
follow|To follow is to go after someone. Ducklings follow their mother in a line.
came|"Came" is the past of "come".
show|To show is to let someone see. A show can also be something you watch, like a play.
around|"Around" means in a circle, or near: The Earth goes around the Sun.
form|A form is a shape, or a page you fill in with your name and address.
small|"Small" means little. Smaller and smallest are its family.
set|A set is a group that goes together, like a set of pencils. To set means to put something down.
put|"Put" stays the same in the past: today I put it here, yesterday I put it there.
end|The end is the last part. Stories often finish with "The End".
why|"Why" asks for a reason. Children ask "why?" hundreds of times a day!
turn|To turn is to move round. It can also mean your go in a game: It's your turn!
here|"Here" means this place. It sounds like "hear", which is what you do with your ears.
off|"Off" is the opposite of on. Don't confuse it with "of".
went|"Went" is the past of "go". It's a strange one: go, went, gone.
need|A need is something you must have, like food and water. A want is something you'd like.
land|Land is the solid ground. About a third of the Earth is land; the rest is water.
us|"Us" means me and other people: Come with us!
move|To move is to go from one place to another. Plants move too, very slowly, towards the light.
try|To try is to have a go. Trying again after a mistake is how we learn.
picture|A picture can be a drawing, painting or photo. "A picture is worth a thousand words."
change|Change means making something different. Caterpillars change into butterflies.
air|Air is all around us, even though we can't see it. It's mostly a gas called nitrogen, plus the oxygen we breathe.
away|"Away" means not here, at a distance.
animal|There are millions of kinds of animals, from tiny insects to giant whales. People are animals too!
point|A point is a sharp end, a dot, or the main idea. You can also point with your finger.
page|A book is made of pages. Each sheet of paper has two pages, one on each side.
letter|A letter is a sign like A or B. A letter can also be a message you send in the post.
mother|A mother is a mum. Mother Earth is a name people give to our planet.
found|"Found" is the past of "find": I found my shoe!
study|To study is to learn about something carefully. A study is also a quiet room for reading.
still|"Still" means not moving, or even now: Are you still hungry?
plant|Plants make their own food from sunlight. To plant means to put a seed in the ground.
cover|A cover goes over something, like the cover of a book.
food|Food gives your body energy to grow and move.
between|"Between" means in the middle of two things.
keep|To keep is to hold on to something. Its past is "kept".
last|"Last" means at the end. It can also mean to keep going: The rain lasted all day.
let|"Let" means allow: Let me help!
city|A city is a big town. The biggest cities have more than 30 million people!
cross|To cross is to go over. Cross can also mean a bit angry, or an X shape.
farm|Farms grow food and keep animals. New Zealand has lots of sheep and dairy farms.
hard|"Hard" means not soft, or not easy. Diamonds are the hardest natural thing.
start|To start is to begin. A race starts with "Ready, set, go!"
saw|"Saw" is the past of "see". A saw is also a tool for cutting wood.
draw|To draw is to make a picture. A draw is also when a game ends with the same score.
left|Left is the side opposite right. It's also the past of "leave": She left early.
late|"Late" means after the right time. "Better late than never" is a saying.
while|"While" means during the time that: I read while I waited.
press|To press is to push down. The press can also mean newspapers and reporters.
night|Night happens when your side of the Earth faces away from the Sun. "Knight" sounds the same but means a soldier on a horse.
real|"Real" means true, not pretend.
life|Life is being alive. Scientists think life on Earth started billions of years ago.
few|"Few" means not many.
north|North is towards the top of most maps. A compass needle points north.
open|"Open" is the opposite of shut. "Open" can also mean friendly and honest.
seem|"Seem" means look like it is true: You seem happy.
next|"Next" means coming straight after: Who's next?
white|White is the colour of snow and milk. White light is really all the colours of the rainbow mixed together!
children|"Children" means more than one child. It's an unusual plural, like mice and geese.
begin|To begin is to start. Its past is "began".
walk|Walking is moving on your feet, one step at a time. Babies usually walk at about one year old.
example|An example shows what you mean. "For example" is often written "e.g.".
paper|Paper was invented in China about 2,000 years ago. Most paper is made from wood.
group|A group is a number of people or things together. A group of wolves is a pack.
music|Music is sound arranged in a pleasing way. Every culture in the world has music.
those|"Those" points to things further away. "These" points to things close by.
both|"Both" means the two of them together.
mark|A mark is a small line or spot. Teachers give marks for good work.
often|"Often" means many times. Some people say the "t", and some don't!
until|"Until" means up to the time when: Wait until I'm ready.
car|The first cars were called "horseless carriages".
feet|"Feet" means more than one foot. It's an unusual plural, like teeth and geese.
care|To care is to look after someone, or to feel that something matters.
second|Second means number two in order. A second is also a very short time: 60 make a minute.
eat|Different animals eat different things. Pandas eat bamboo for up to 14 hours a day!
room|A room is a space inside a building. "Room" also means space: Is there room for me?
began|"Began" is the past of "begin".
fish|Fish breathe underwater using gills. The plural of fish is usually just "fish".
stop|To stop is to finish moving. A stop sign is red and has eight sides.
base|A base is the bottom part that holds something up. In games, a base can be a safe spot.
cut|To cut is to split with scissors or a knife. Its past is also "cut".
face|Your face has your eyes, nose and mouth. No two faces are exactly the same.
main|"Main" means most important, like the main road.
girl|A girl grows up to be a woman.
usual|"Usual" means what normally happens. Unusual means strange or different.
ready|"Ready" means prepared to start. "Ready, set, go!"
above|"Above" means higher than. The opposite is below.
ever|"Ever" means at any time. "Happily ever after" ends lots of fairy tales.
list|A list is words written one under another, like a shopping list.
though|"Though" means but, or even if. Its "ough" sounds like "oh".
feel|To feel is to touch something, or to have a feeling like happy or sad.
talk|To talk is to speak with someone. People talk at about 150 words a minute.
bird|Birds are the only animals with feathers. They came from dinosaurs!
soon|"Soon" means in a short time.
body|Your body is made of trillions of tiny cells.
family|A family is people who care for each other, like parents, children, grandparents and cousins.
song|A song is music with words. Birds and whales sing songs too.
black|Black is the darkest colour. It's what we see when there's no light at all.
short|"Short" means not tall or not long. Its opposite is tall or long.
class|A class is a group of students who learn together. It also means a group of similar things.
happen|"Happen" means take place: What happened?
complete|"Complete" means finished, with nothing missing.
ship|A ship is a very big boat. The biggest ships are longer than three rugby fields.
area|Area is the space something covers. In maths, area is measured in squares.
order|Order means a tidy arrangement, or what you ask for in a café.
south|South is towards the bottom of most maps. New Zealand is in the southern half of the world.
problem|A problem is something difficult that needs solving. Maths problems are puzzles with numbers.
piece|A piece is a part of something. It sounds like "peace", which means calm.
told|"Told" is the past of "tell".
knew|"Knew" is the past of "know". It sounds the same as "new".
pass|To pass is to go by, or to hand something on, like passing a ball.

power|Power is strength or energy. Electricity is a kind of power.

rest|To rest is to relax. "The rest" means what is left over.

able|"Able" means can do something.

wheel|The wheel is one of the most important inventions ever. It was invented about 5,500 years ago.
force|A force is a push or a pull. Gravity is a force that pulls things down.

test|A test checks what you know. Scientists also test their ideas.
common|"Common" means happening often, or ordinary.
gold|Gold is a shiny yellow metal that never rusts. It's so soft you can squash it.
possible|"Possible" means it can happen. "Impossible" means it can't.

ago|"Ago" means in the past: long ago, a week ago.
ran|"Ran" is the past of "run".
check|To check is to make sure something is right. A tick is also called a check.
game|A game is something you play for fun, with rules. Chess is over 1,500 years old.
miss|To miss is to not hit or catch something, or to feel sad that someone isn't with you.
brought|"Brought" is the past of "bring". It sounds like "bought", which is the past of "buy".
heat|Heat is warmth. Heat always moves from hot things to cold things.
bring|To bring is to carry something here. Its past is "brought".
distant|"Distant" means far away.
fill|To fill is to make something full.
east|East is where the sun comes up. New Zealand is one of the first places to see each new day.
language|There are over 7,000 languages in the world. In New Zealand, English, Te Reo Māori and New Zealand Sign Language are official languages.

grand|"Grand" means big and impressive. A grand is also slang for a thousand dollars.
yet|"Yet" means up to now, or still: Not yet!
wave|A wave is a moving ridge of water, or moving your hand to say hello.
drop|To drop is to let something fall. A drop is also a tiny amount of liquid.
present|A present is a gift. "Present" also means here now, and it's the time we're in.
engine|An engine is a machine that makes something move, like a car or train.

arm|Your arm goes from your shoulder to your hand. An octopus has eight arms.
wide|"Wide" means big from side to side.
sail|A sail catches the wind to push a boat along. It sounds the same as "sale".
material|Material is what something is made of: wood, metal, plastic, cloth.
size|Size is how big something is.
vary|To vary means to change, or to be different.
settle|To settle is to make a new home somewhere, or to calm down.
speak|To speak is to say words out loud. Its past is "spoke".
weight|Weight is how heavy something is. It sounds the same as "wait".
general|"General" means about most things. A general is also an army leader.
ice|Ice is frozen water. It floats, which is why icebergs float.
matter|Matter is what everything is made of. "What's the matter?" means what's wrong?
pair|A pair is two things that go together, like socks. It sounds like "pear".
include|To include is to have as part of something, or to let someone join in.
syllable|A syllable is a beat in a word. Clap it: but-ter-fly has three syllables.
felt|"Felt" is the past of "feel". Felt is also a thick soft cloth.
perhaps|"Perhaps" means maybe.
pick|To pick is to choose, or to pull off a fruit or flower.
sudden|"Sudden" means happening quickly, without warning.
count|To count is to say numbers in order. A count is also a kind of nobleman, like in Dracula!
reason|A reason is why something happens.
length|Length is how long something is.
represent|To represent is to stand for something, like a flag represents a country.
art|Art is drawing, painting, sculpture and making things. Some of the oldest art is cave paintings over 40,000 years old.
subject|A subject is what something is about, or a thing you learn at school like maths or science.
region|A region is an area of a country, like Auckland or Canterbury.
hunt|To hunt is to look for and chase. Wolves hunt together as a team.
probable|"Probable" means likely to happen.
brother|A brother is a boy with the same parents as you.
ride|To ride is to sit on something and make it move, like a bike or a horse.
cell|Cells are the tiny building blocks of all living things. A cell is also a small room in a prison.
believe|To believe is to think something is true. A spelling trick: never believe a lie (bel-ie-ve)!
sit|To sit is to rest on a chair. Its past is "sat".
race|A race is a competition to be fastest.
store|A store is a shop. To store means to keep something for later.
summer|Summer is the warmest season. In New Zealand, Christmas is in summer!
prove|To prove is to show that something is true.
lone|"Lone" means alone, by itself, like a lone wolf.
leg|Legs help us stand and walk. A centipede can have hundreds of legs.
exercise|Exercise is moving your body to keep fit and healthy.
wall|A wall is a side of a room. The Great Wall of China is thousands of kilometres long.
mount|To mount is to climb on. Mount is also part of a mountain's name, like Mount Taranaki.
wish|A wish is something you hope will happen. Some people wish on shooting stars.
sky|The sky looks blue because air scatters blue sunlight more than other colours.
board|A board is a flat piece of wood. "On board" means on a ship, plane or train.
joy|Joy is great happiness.
winter|Winter is the coldest season. In New Zealand it is in June, July and August.
written|"Written" means put down in words.
wild|"Wild" means living in nature, not tame, like wild wolves.
instrument|An instrument makes music, like a piano or violin. It can also be a tool for measuring.
kept|"Kept" is the past of "keep".
glass|Glass is made by melting sand. It's hard, clear and breaks easily.
grass|Grass is one of the most common plants on Earth. Wheat and rice are kinds of grass!
cow|Cows have four parts to their stomachs. New Zealand has millions of dairy cows.
job|A job is work you do, often to earn money.
edge|An edge is the outside line of something, like the edge of a table.
sign|A sign is a board with a message, or a mark that means something. Sign language uses hands to talk.
visit|To visit is to go and see someone or somewhere.
past|The past is the time before now. "Past" can also mean going by: We walked past the school.
yard|A yard is the land around a house. A yard is also a measure, a bit less than a metre.
beat|To beat is to win against. A beat is also the steady rhythm in music.
gas|A gas is like air: it spreads out to fill any space. Steam is water as a gas.
dream|Everyone dreams while they sleep, even if they don't remember. A dream is also a big wish.
evening|The evening is the end of the day, as it gets dark.
condition|Condition means how something is: The bike is in good condition.
feed|To feed is to give food to.
tool|A tool helps you do a job, like a hammer. Some animals use tools too, like crows using sticks.
total|The total is the whole amount added up.
basic|"Basic" means simple, the first things you need to know.
smell|Your nose can smell thousands of things. Smells can bring back strong memories.
valley|A valley is low land between hills or mountains, often with a river.
double|"Double" means two times as much.
seat|A seat is something to sit on.
arrive|To arrive is to get to a place.
master|A master is someone very good at something, like a chess master.
track|A track is a path, or marks left by feet. Trains run on tracks.
parent|A parent is a mum or dad.
shore|The shore is the land along the edge of the sea or a lake.
division|Division is splitting into equal parts. It's the opposite of multiplying.
sheet|A sheet is a flat piece of paper or cloth.
substance|A substance is stuff or material, like water, sand or sugar.
favour|A favour is a kind thing you do for someone.
connect|To connect is to join together.
post|Post is mail. A post is also a pole stuck in the ground.
chord|A chord is several music notes played together.
fat|Fat is oily stuff in food. Our bodies need a little fat to be healthy.
glad|"Glad" means happy.
original|"Original" means the first one, not a copy.
share|To share is to let others have some too.
station|A station is a place where trains or buses stop. A big farm in New Zealand is also called a station.
charge|To charge is to rush forward, or to fill with electricity, like charging a phone.
proper|"Proper" means right and correct.
bar|A bar is a long straight piece. A chocolate bar is a tasty one!
offer|To offer is to say you will give something.
segment|A segment is a piece of something, like a segment of an orange.
instant|An instant is a very short moment. Instant means happening straight away.
market|A market is a place to buy and sell things, often outside on stalls.
degree|A degree measures heat or angles. A full turn is 360 degrees.
populate|To populate is to fill a place with people or animals.
chick|A chick is a baby bird. Chicks talk to their mother while they're still in the egg!
dear|"Dear" means loved, and starts a letter: Dear Nan. It sounds the same as "deer".
enemy|An enemy is someone who is against you. The opposite is a friend.
reply|To reply is to answer.
drink|You should drink water every day. Your body is mostly water!

support|To support is to help hold up, or to help and encourage someone.
speech|A speech is a talk given to a group of people.
nature|Nature is plants, animals and the world not made by people.
range|A range is a group of things, or a row of mountains, like the Southern Alps.
steam|Steam is water as a gas. Old trains were powered by steam.
motion|Motion means movement. A motion picture is a film!
path|A path is a track to walk on.
liquid|A liquid flows and takes the shape of its container, like water or juice.
log|A log is a thick piece of tree trunk. A log is also a written record, like a ship's log.
meant|"Meant" is the past of "mean": I meant to tell you.
quotient|The quotient is the answer to a division. 12 divided by 3 has a quotient of 4.

shell|A shell is the hard outside of an egg, nut or sea creature. Hermit crabs move into bigger shells as they grow.
neck|Your neck holds up your head. A giraffe's neck has seven bones, the same number as yours!
sugar|Sugar gives you quick energy, but too much is bad for your teeth.
skill|A skill is something you're good at because you practised.
women|"Women" is more than one woman. The "o" sounds like "i"!
season|The four seasons are spring, summer, autumn and winter.
solution|A solution is the answer to a problem. In science, it's also a liquid with something dissolved in it.
silver|Silver is a shiny grey metal. Second place often wins a silver medal.
thank|To thank someone is to tell them you're grateful.
branch|A branch grows out from a tree's trunk. A branch can also be one shop of many.
match|A match is a small stick that makes fire, or a game between two teams. Things that match go well together.

fig|A fig is a soft sweet fruit full of tiny seeds.

steel|Steel is a strong metal made from iron. It sounds the same as "steal".

forward|"Forward" means towards the front.

bought|"Bought" is the past of "buy".
pitch|A pitch is a sports field. Pitch is also how high or low a sound is.

band|A band is a group that plays music, or a strip of something, like a rubber band.

trip|A trip is a journey. To trip is to fall over.
farmer|A farmer grows crops or looks after animals on a farm.
blood|Blood carries oxygen around your body. Your heart pumps it.
lie|A lie is something untrue. To lie down means to rest flat.
spot|A spot is a small mark, or a place. Leopards have spots.
fun|Fun is enjoyment. Learning can be fun!

thin|"Thin" means not thick.
lift|To lift is to raise up. A lift is also an elevator that carries people up buildings.
flow|To flow is to move along smoothly, like a river.
dress|A dress is clothing. To dress means to put clothes on.
crowd|A crowd is lots of people together.
eye|Your eyes see by catching light. An eagle's eyes are bigger than its brain!

cotton|Cotton is a soft cloth made from fluffy fibres of the cotton plant.
born|You were born on your birthday.
cent|A cent is one hundredth of a dollar.
fit|"Fit" means healthy, or the right size.
skin|Your skin is the biggest organ of your body. It keeps germs out.
crease|A crease is a line made by folding.
hole|A hole is an empty space. "Whole" sounds the same but means all of something.

cool|"Cool" means a bit cold, or really good.
fresh|"Fresh" means new, or not stale.
search|To search is to look carefully for something.
gentle|"Gentle" means soft and kind.
woman|A woman is a grown-up girl.
captain|A captain is the leader of a team or a ship.

newspaper|Newspapers print the news every day. Most people now read news online.
