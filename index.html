<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080B">
<meta name="description" content="A word game: read it, know it, spell it, and fill the moon.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Moon">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Luna's Word Moon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Lexend:wght@400;700&display=swap">
<style>
/* A night sky: plain black, one word at a time. Deliberately a single dark look. No pink anywhere.
   Each word fills a moon: new -> crescent (reads it OR knows it) -> half (reads AND knows) -> full (spells it too). */
:root{
  --bg:#07080B; --panel:#12151B; --panel2:#1A1E26; --line:#2C323D; --line2:#454D5B;
  --ink:#F5F1E6; --muted:#9BA5B1;
  --moon:#F4D26B; --moon-soft:#352E1B;
  --good:#3FC872; --good-soft:#123020; --no:#E5383B; --no-soft:#3A1415;
  --try:#FF9F1C; --try-soft:#3A2610;
  --dot1:#FF9F1C; --dot2:#9D7BFF; --dot3:#F4D26B;
  --font-display:'Sniglet','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.5}
.app{max-width:780px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--moon);outline-offset:3px}

.top{display:flex;align-items:center;gap:10px;min-height:48px}
.moons{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0;font-size:22px;line-height:1}
.moons span{display:inline-flex;transition:transform .3s}
.moons span.now{transform:translateY(-4px) scale(1.2)}
.mn{width:1em;height:1em;vertical-align:-0.14em;flex:none}
@media (max-width:600px){.top{flex-wrap:wrap;justify-content:flex-end}.moons{order:5;flex-basis:100%;justify-content:center}}
.iconbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line);font-size:22px;flex:none}
.grown{position:relative;overflow:hidden;font-size:13px;color:var(--muted);padding:8px 12px;border-radius:999px;border:1px solid var(--line);flex:none}
.grown .fill{position:absolute;inset:0;width:0;background:var(--moon-soft);z-index:0}
.grown span{position:relative}
.snd{margin:0;background:var(--try-soft);border:1px solid var(--try);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:15px}

main{flex:1;display:flex;flex-direction:column;gap:22px}

.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:4vh}
.moonwolf{position:relative;width:min(240px,60vw);aspect-ratio:1;max-width:100%}
.moonwolf .disc{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 38% 34%,#FFF4C8 0%,var(--moon) 55%,#D9B24B 100%);box-shadow:0 0 60px 10px rgba(244,210,107,.18)}
.moonwolf svg{position:absolute;left:18%;bottom:-2%;width:64%;height:auto}
.hero h1{font-size:clamp(32px,7vw,50px)}
.hero .sub{color:var(--muted);font-size:17px;max-width:32ch}
.vnote{color:var(--muted);font-size:14px;max-width:40ch}
.big{font-family:var(--font-display);font-size:28px;font-weight:800;padding:16px 40px;border-radius:999px;background:var(--moon);color:#1B1606;box-shadow:0 0 0 6px var(--moon-soft)}
.big[disabled]{opacity:.5;cursor:default}
.soft{font-family:var(--font-display);font-size:20px;padding:12px 26px;border-radius:999px;border:2px solid var(--line2);color:var(--ink)}
.small{font-size:15px;color:var(--muted);padding:8px 16px;border-radius:999px;border:1px solid var(--line2)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.center{justify-content:center}
.piles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:520px}
.pile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pile b{font-size:26px;line-height:1.1}
.pile .n{font-family:var(--font-display);font-size:24px}
.pile small{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:16px;display:inline-flex;gap:6px;align-items:center}

/* one word */
.stage{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:1vh}
.tag{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 14px;border-radius:999px;border:2px solid currentColor;color:var(--muted)}
.bigword{font-weight:700;font-size:clamp(56px,15vw,104px);letter-spacing:.02em;line-height:1.1;padding:8px 28px;border-radius:24px;background:var(--panel);border:2px solid var(--line);max-width:100%;white-space:nowrap;overflow:hidden}
.bigword.ghost{color:transparent;user-select:none}
.typed{white-space:nowrap;overflow:hidden}
.ask{font-family:var(--font-display);font-size:clamp(24px,5vw,34px)}
.hint{color:var(--muted);font-size:16px}
.yn{display:flex;gap:40px;justify-content:center}
.ynb{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-size:58px;font-weight:700;line-height:1;border:4px solid}
.ynb.no{color:var(--no);border-color:var(--no);background:var(--no-soft)}
.ynb.yes{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.ynb:active{transform:scale(.95)}
.dots{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:6px}
.dot{width:84px;height:84px;border-radius:50%;transition:transform .25s ease,box-shadow .25s ease;border:4px solid rgba(255,255,255,.12)}
.dot.c0{background:var(--dot1)} .dot.c1{background:var(--dot2)} .dot.c2{background:var(--dot3)}
.dot.on{transform:scale(1.4);box-shadow:0 0 0 6px rgba(255,255,255,.15),0 0 34px 6px rgba(255,255,255,.18)}
.dot.right{box-shadow:0 0 0 7px var(--good)} .dot.wrong{box-shadow:0 0 0 7px var(--no)}
.dot.fade{opacity:.35}
.explain{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:30ch}
.explain .em{font-size:76px;line-height:1.1}
.explain p{font-size:24px}
.timer{width:min(320px,80%);height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--moon);transform-origin:left;animation:shrink var(--t,2.5s) linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.typed{min-height:84px;min-width:min(420px,90%);padding:10px 18px;border-radius:18px;background:var(--panel);border:2px solid var(--line);border-bottom:4px solid var(--moon);font-weight:700;font-size:clamp(40px,10vw,64px);letter-spacing:.06em;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}
.typed.right{border-color:var(--good)} .typed.wrong{border-color:var(--no)}
.kb{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;width:100%;max-width:560px}
.key{height:54px;border-radius:12px;background:#F5F1E6;color:#16181D;font-weight:700;font-size:26px;box-shadow:0 4px 0 #9BA5B1}
.key:active{transform:translateY(2px);box-shadow:0 2px 0 #9BA5B1}
.key.wide{grid-column:span 2;font-size:20px;background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #000;border:1px solid var(--line2)}
.key.go{background:var(--good);color:#04140A}
.fb{min-height:40px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.fb .say{font-family:var(--font-display);font-size:30px}
.fb .say.good{color:var(--good)} .fb .say.try{color:var(--try)}
.fb .move{font-size:19px} .fb .move b{color:var(--moon)}

.cloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:16px 20px;padding:18px 4px;min-height:34vh}
.cw{font-weight:700;padding:8px 18px;border-radius:999px;background:var(--panel2);border:2px solid var(--line2);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.cw{-webkit-touch-callout:none}
.cw.held{border-color:var(--moon);scale:1.08}
.cw.sel{border-color:var(--moon);background:var(--moon-soft)}
.drag{position:fixed;pointer-events:none;z-index:30;translate:-50% -50%;scale:1.12;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.zone{border:3px dashed var(--line2);border-radius:20px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:120px;font-size:16px;text-align:center;min-width:0}
.zone b{font-size:38px;line-height:1.1} .zone small{color:var(--muted);font-size:12px}
.zone .got{font-size:13px;color:var(--moon);overflow-wrap:anywhere}
.zone.hot{border-color:var(--moon);background:var(--moon-soft)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));translate:-50% -140%;z-index:50;background:var(--panel2);border:2px solid var(--moon);color:var(--ink);border-radius:999px;padding:10px 18px;font-family:var(--font-display);font-size:18px;transition:translate .3s ease;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{translate:-50% 0}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:12px}
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.bcard.got{border-color:var(--moon)}
.bhead{display:flex;flex-direction:column;align-items:center;gap:2px} .bemoji{font-size:40px;line-height:1.1}
.tiers{display:flex;gap:10px;font-size:30px} .tiers span{opacity:.2;filter:grayscale(1)} .tiers span.on{opacity:1;filter:none}
.bar{width:100%;height:10px;border-radius:99px;background:var(--panel2);overflow:hidden} .bar i{display:block;height:100%;background:var(--moon)}
.lesson p{margin:0 0 8px} .lesson{max-width:46ch}
.practice{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.practice summary{cursor:pointer;font-family:var(--font-display);font-size:18px}
.practice .chip small{color:var(--muted);font-size:12px}
.gamebox{display:flex;flex-direction:column;gap:10px}
.gtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .ginfo{flex:1;min-width:0;font-family:var(--font-display);font-size:18px} .glives{font-size:20px}
.gprog{position:relative;height:12px;border-radius:99px;background:var(--panel2);overflow:visible} .gprog i{display:block;height:100%;width:0;border-radius:99px;background:var(--moon)} .gprog span{position:absolute;right:-6px;top:-9px;font-size:22px}
.gwrap{position:relative;border-radius:18px;overflow:hidden;border:2px solid var(--line2)}
#gc{display:block;width:100%;touch-action:none;background:#0E1F16}
.gover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);padding:12px}
.gcard{background:var(--panel);border:2px solid var(--line2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;max-width:440px}
.gcard .big,.gcard .soft{font-size:18px;padding:10px 16px}
.plist{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.pbtn{font-family:var(--font-display);font-size:24px;padding:14px 20px;border-radius:18px;background:var(--panel2);border:2px solid var(--line2);text-align:left}
.pbtn:hover{border-color:var(--moon)}
.padd{display:flex;gap:10px;width:min(420px,100%);flex-wrap:wrap;justify-content:center}
.padd input{flex:1;min-width:0;font:inherit;font-size:20px;padding:12px 16px;border-radius:999px;border:2px solid var(--line2);background:var(--panel);color:var(--ink)}
.padd .big{font-size:22px;padding:12px 24px}
.holdbtn{position:relative;overflow:hidden} .holdbtn .fill{position:absolute;inset:0;width:0;background:var(--moon-soft)} .holdbtn span{position:relative}
.phrasebig{font-family:var(--font-display);font-size:clamp(30px,7.5vw,52px);line-height:1.15;color:var(--moon);max-width:18ch}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:10px}
.scard{text-align:left;padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-size:17px}
.scard.got{border-color:var(--moon)}
.exitbtn{flex:none;font-size:15px;font-weight:700;padding:10px 14px;border-radius:999px;border:2px solid var(--line2);color:var(--ink);background:var(--panel2)}
.rprog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.rprog span{flex:none;font-weight:700;color:var(--ink)}
.rbar{flex:1;height:8px;border-radius:99px;background:var(--panel2);overflow:hidden} .rbar i{display:block;height:100%;width:0;background:var(--moon);transition:width .3s}
.nope{font-family:var(--font-display);font-weight:800;font-size:20px;padding:10px 20px;border-radius:999px;border:3px solid var(--no);color:var(--ink)}
.knowall{align-self:flex-end;font-family:var(--font-display);font-weight:800;font-size:18px;padding:10px 18px;border-radius:999px;background:#2F9BFF;color:#04121F;box-shadow:0 0 0 4px rgba(47,155,255,.25)}
/* "I'm sure" / "Test me again" */
.sure{font-family:var(--font-display);font-weight:800;font-size:20px;padding:12px 22px;border-radius:999px;background:var(--good);color:#04140A}
.again{font-family:var(--font-display);font-weight:800;font-size:20px;padding:10px 20px;border-radius:999px;border:3px solid var(--dot2);color:var(--ink)}
/* My words: four columns of moons, headings at the bottom */
.wordsTop{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.qbox{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.chips.left{justify-content:flex-start}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-items:end;min-height:40vh}
.col{display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.col+.col{border-left:1px solid var(--line)}
.mgrid{display:flex;flex-wrap:wrap-reverse;gap:4px;justify-content:center;padding:6px 2px}
.mb{width:24px;height:24px;padding:0;display:grid;place-items:center;font-size:21px;border-radius:50%}
.mb.queued{box-shadow:0 0 0 2px var(--dot2)}
.heads{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line2)}
.colhead{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:14px;line-height:1.25}
.colhead b{font-size:18px;display:flex;gap:4px;align-items:center}
.colhead small{color:var(--muted);font-size:12px}
.wpop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}
.popcard{background:var(--panel);border:2px solid var(--line2);border-radius:24px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px;width:min(520px,100%);text-align:center}
.inq{border-color:var(--dot2)}
.up{border-color:var(--moon);color:var(--moon)}
.alike{display:flex;flex-direction:column;gap:8px;width:100%;max-width:440px;margin-top:6px}
.alrow{display:flex;gap:12px;align-items:baseline;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.alrow.me{border-color:var(--moon)}
.alw{font-weight:700;font-size:24px;min-width:4.5em} .alm{font-size:17px;color:var(--ink)}
.mean{display:flex;flex-direction:column;align-items:center;gap:4px;padding-block:6px}
.mean+.mean{border-top:1px solid var(--line)}
.deep{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:14px 16px;font-size:19px;line-height:1.5;max-width:40ch;text-align:left}
.pmean{width:100%;text-align:center}
.pmean summary{cursor:pointer;color:var(--moon);font-size:16px;padding:6px}
.pmean .explain p{font-size:19px} .pmean .explain .em{font-size:48px}
/* grown-ups */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:22px}
.panel p{color:var(--muted);font-size:16px}
.vtips{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2)}
.vtips summary{cursor:pointer;font-weight:700;color:var(--moon)}
.vtips p{margin-top:8px}
#bkIn{min-height:72px}
.pill{padding:8px 14px;border-radius:999px;border:2px solid var(--line);font-size:15px}
.pill[aria-pressed="true"]{border-color:var(--moon);background:var(--moon-soft)}
.pilelist{display:flex;flex-direction:column;gap:8px;font-size:15px}
.pilelist span{color:var(--muted)}
textarea{width:100%;min-height:120px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;font:14px/1.4 ui-monospace,Consolas,monospace}
input[type=range]{width:min(320px,100%);accent-color:var(--moon)}
.danger{border-color:var(--no);color:var(--no)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="wolf" viewBox="0 0 120 104">
    <path d="M20 46 L28 4 L54 30 Z M100 46 L92 4 L66 30 Z" fill="#6F7D8A" stroke="#22323B" stroke-width="2.5" stroke-linejoin="round"/>

    <path d="M60 30 C54 40 52 52 50 62 L70 62 C68 52 66 40 60 30 Z" fill="#E9EDF1"/>

    <circle cx="76" cy="54" r="6.5" fill="#E8A33B" stroke="#22323B" stroke-width="2"/><circle cx="76" cy="54" r="3.2" fill="#22323B"/><circle cx="77.5" cy="52.5" r="1.2" fill="#fff"/>
    <ellipse cx="60" cy="67" rx="7.5" ry="5" fill="#22323B"/>

<div class="app">
  <header class="top">
    <button class="exitbtn" id="exitBtn" type="button" hidden>✕ Stop</button>
    <div class="moons" id="moons" aria-label="This round's words"></div>
    <button class="iconbtn" id="stopBtn" type="button" aria-label="Stop talking" hidden>■</button>
    <button class="iconbtn" id="wordsBtn" type="button" aria-label="My words">🌙</button>
    <button class="iconbtn" id="hearBtn" type="button" aria-label="Hear it again" hidden>🔊</button>
    <button class="grown" id="grownBtn" type="button" aria-label="Grown-ups page. Press and hold to open."><i class="fill" id="grownFill"></i><span>Grown-ups (hold)</span></button>
  </header>
  <div class="rprog" id="rprog" hidden><span id="rtext"></span><div class="rbar"><i id="rbar"></i></div></div>
  <p class="snd" id="snd" role="status" hidden></p>
