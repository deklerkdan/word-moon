bottom|The bottom is the lowest part.
broke|"Broke" is the past of "break".

dollar|New Zealand's money is the dollar, made of 100 cents.
stream|A stream is a small river.
fear|Fear is being scared. Fear helps keep us safe from danger.

hurry|To hurry is to go fast because there's not much time.

choose|To choose is to pick one. Its past is "chose".

student|A student is someone who is learning.
corner|A corner is where two sides meet.
hill|A hill is like a small mountain.

sand|Sand is tiny grains of rock and shell, worn down over a very long time.
soil|Soil is the earth that plants grow in. A spoonful of soil has billions of tiny living things.
roll|To roll is to turn over and over. A roll is also a small round piece of bread.
finger|You have five fingers on each hand, counting your thumb.
industry|Industry is making things in factories, or a type of business.
value|Value is how much something is worth.
fight|A fight is a struggle against someone. Talking it out is usually better!
excite|To excite is to make someone happy and eager.
natural|"Natural" means from nature, not made by people.
view|A view is what you can see from a place, like the view from a mountain top.
sense|Your five senses are seeing, hearing, smelling, tasting and touching.
capital|A capital is the main city of a country; New Zealand's is Wellington. A capital letter is a big letter.
danger|Danger is something that could hurt you.
fruit|A fruit is the part of a plant that holds its seeds. Tomatoes and cucumbers are fruits too!
rich|"Rich" means having lots of money, or lots of something good.
thick|"Thick" means wide from one side to the other.
soldier|A soldier is someone in an army.
process|A process is the steps to make something happen.
operate|To operate is to make a machine work. Doctors also operate on patients.
wing|Birds, bats and insects fly with wings. Planes have wings too.
create|To create is to make something new.
neighbour|A neighbour lives next door. In New Zealand we spell it with a "u".
wash|To wash is to clean with water and soap.
rather|"Rather" means more willingly, or quite: I'd rather stay home.
corn|Corn is a tall plant with yellow seeds we eat. Popcorn pops because of water inside each kernel!
compare|To compare is to see how things are alike or different.
string|String is a thin cord. Violins and guitars have strings.
depend|To depend is to need someone or something.
meat|Meat is food from animals. "Meet" sounds the same but means coming together.
rub|To rub is to move something back and forth while pressing.
tube|A tube is a long hollow pipe. London's underground train is called the Tube!
kitchen|The kitchen is the room where food is cooked.
village|A village is a small group of houses in the country.
plural|"Plural" means more than one. Most plurals add an "s", like cats.
wrote|"Wrote" is the past of "write".
broken|"Broken" means cracked into pieces, or not working.
moment|A moment is a very short time.
anger|Anger is feeling very cross. It's OK to feel angry, but not OK to hurt others.
wire|A wire is a long thin piece of metal. Electricity travels along wires.
shoulder|Your shoulder joins your arm to your body.
spread|To spread is to cover a surface, like spreading butter.
arrange|To arrange is to put things in order.
lake|A lake is a big area of water with land all around. Lake Taupō is New Zealand's biggest.

kitten|A kitten is a baby cat. Kittens sleep up to 20 hours a day!
ladder|A ladder has steps for climbing up high.
pocket|A pocket is a little pouch sewn into clothes.`;

/* A reading is a list of: words to say, {pause:ms}, {beep:true}, or {fn} (run something on screen at that moment).
   Words between two of those are said as one piece. A newer say() or hush() ends the rest. */
let lastLines=[], sayToken=0;
async function say(items, opts){
  opts=opts||{};
  items=[].concat(items).filter(Boolean);
  if(!opts.noRemember) lastLines=items;
  if(!state.sound || !items.length) return;
  if(state.readMode==='needed' && !opts.need){ sayToken++; return; }
  const my=++sayToken; let buf=[];
  const flush=async()=>{ if(!buf.length) return; const l=buf; buf=[]; await speakLines(l, opts); };
  for(const it of items){
    if(my!==sayToken) return;
    if(typeof it==='string'){ buf.push(it); continue; }
    await flush(); if(my!==sayToken) return;
    if(it.pause) await wait(it.pause);
    else if(it.beep){ chime('beep'); await wait(550); }
    else if(it.fn){ try{ it.fn(); }catch(e){} }
  }
  if(my===sayToken) await flush();
}
async function speakLines(lines, opts){
  if(!ttsSettled){ await Promise.race([ttsReady, wait(1500)]); }
  if(tts && !ttsBlocked){
    try{ await tts.speak(lines.map(text=>({text, voice:opts.voice||state.voice})), {language:'en', rate:state.rate}); heardOnce=true; if(soundTrouble){ soundTrouble=''; showTrouble(); } }
    catch(err){
      const c=err&&err.code;
      if(c==='not_granted'){ ttsBlocked=true; soundTrouble='off'; showTrouble(); }
      else if(c==='no_gesture'){ const h=$('#hearBtn'); if(h&&h.animate) h.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:500,iterations:2}); }
      else if(c==='stopped'){ /* replaced or stopped on purpose */ }
      else { await browserSay(lines); }
    }
    return;
  }
  if(!ttsBlocked) await browserSay(lines);
}

const dbReady = hasClaude ? window.claude.use('db').catch(()=>null) : Promise.resolve(null);
const userReady = hasClaude ? window.claude.use('user').catch(()=>null) : Promise.resolve(null);
let db=null, uid=null, isOwner=false, saveStatus='checking', lastSaved=0, started=false, dirty=false, saving=false, saveTimer=null, fails=0;
const timeout=(p,ms)=>Promise.race([p, wait(ms||10000).then(()=>{ throw {code:'timeout'}; })]);
const profilePath=id=>'data/users/'+uid+'/p-'+id;
async function pullProfile(id){
  if(!db||!uid||!id) return;
  try{ const snap=await timeout(db.doc(profilePath(id)).get());
    if(snap.exists){ const d=snap.data()||{}; const r=migrate(d.state); if(r && id===who && (r.updatedAt||0)>(state.updatedAt||0) && !started){ state=r; persistLocal(); if(appReady) render(); } } }catch(e){}
}
const loaded=(async()=>{
  db=await dbReady;
  const u=await userReady;
  try{ uid = u ? await u.id() : null; isOwner = u ? !!(await u.isOwner()) : false; }catch(e){ uid=null; }
  loadPacksRemote();
  if(!db||!uid){ saveStatus='local'; return; }
  try{
    /* names saved on other devices */
    const qs=await timeout(db.collection('data/users/'+uid).get());
    let added=false;
    qs.docs.forEach(d=>{ const v=d.data&&d.data(); const p=v&&v.player; if(p&&p.id&&!players.some(x=>x.id===p.id)){ players.push({id:p.id,name:p.name}); added=true; } });
    if(added){ lsSet(NAMES_KEY,players); if(appReady && view==='who') render(); }
    /* the owner's progress from before names existed */
    if(isOwner && !players.length){ const old=await timeout(db.doc('progress/words').get()).catch(()=>null);
      if(old && old.exists){ const r=migrate(old.data()); if(r && (!legacy || (r.updatedAt||0)>(legacy.updatedAt||0))) legacy=r; if(appReady && view==='who') render(); } }
    if(who) await pullProfile(who);
    saveStatus='ok';
  }catch(e){ saveStatus='error'; }
})();
function save(){ try{ tidyWords(); }catch(e){} state.updatedAt=Date.now(); persistLocal(); dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,1200); }
async function flush(){
  if(saving||!dirty||!db||!uid||!who||fails>=3) return;
  saving=true; dirty=false;
  try{ await db.doc(profilePath(who)).set({player:{id:who,name:playerName()}, state:JSON.parse(JSON.stringify(state))}); saveStatus='ok'; lastSaved=Date.now(); fails=0; }
  catch(e){ saveStatus='error'; dirty=true; fails++; }
  saving=false;
  if(dirty && fails<3) saveTimer=setTimeout(flush,3000);
}
function logRound(){
  if(!db||!uid||!sess) return;
  db.doc('data/users/'+uid+'/r-'+Date.now()).set({player:who, day:today(), at:new Date().toISOString(), mode:sess.mode, words:sess.list.map(w=>w+':'+phaseOf(w))}).catch(()=>{});
}
/* choosing, adding and removing names */
function choosePlayer(id){
  stopGame(); clearTimers(); hush();
  who=id; lsSet(WHO_KEY,id); loadLocal(id); started=false; sess=null; cur=null; fails=0;
  view='start'; render(); pullProfile(id);
}
function addPlayer(name){
  name=String(name||'').trim().slice(0,30); if(!name) return;
  let id=slugName(name), n=2; while(players.some(p=>p.id===id)) id=slugName(name)+'-'+(n++);
  const first=!players.length;
  players.push({id,name}); lsSet(NAMES_KEY,players);
  who=id; lsSet(WHO_KEY,id);
  state = (first && legacy) ? Object.assign(blank(), legacy) : blank();
  if(first && legacy){ legacy=null; try{ localStorage.removeItem(STORE); }catch(e){} }
  started=false; sess=null; cur=null;
  save(); view='start'; render();
}
function removePlayer(id){
  players=players.filter(p=>p.id!==id); lsSet(NAMES_KEY,players);
  try{ localStorage.removeItem(STORE+':'+id); }catch(e){}
  if(db&&uid) db.doc(profilePath(id)).delete().catch(()=>{});
  if(who===id){ who=null; lsSet(WHO_KEY,null); state=blank(); }
  view='who'; render();
}

async function makePack(pack){

  if(!sample){ toast('Making word packs needs Claude: open this page on claude.ai in Chrome or Edge, signed in.'); return false; }
  if(gen) return false;
  gen={id:pack.id, count:(PACKDATA[pack.id]||{words:[]}).words.length, msg:'Claude is writing your words…', cancel:false};
  if(view==='badges') render();
  const data=PACKDATA[pack.id]||(PACKDATA[pack.id]={id:pack.id,words:[]});
  let empty=0;
  while(data.words.length<PACK_SIZE && !gen.cancel){
    const exclude=Array.from(new Set(WORDS.map(e=>e.w).concat(data.words.map(x=>x.w))));
    let res;
    try{ res=await sample.json(packPrompt(pack, exclude), {modelTier:'default', cache:false}); }
    catch(e){ gen.msg=e&&e.code==='rate_limited'?'Claude needs a rest. Try again later.':e&&e.code==='not_granted'?'Asking Claude is turned off for this page.':'Something went wrong. Try again later.'; break; }
    const items=(res&&Array.isArray(res.words))?res.words:[];
    const fresh=[];
    items.forEach(it=>{
      const w=String(it&&it.word||'').trim().toLowerCase(); if(!/^[a-z]{2,20}$/.test(w)) return;
      if(BY[w]||data.words.some(x=>x.w===w)||fresh.some(x=>x.w===w)) return;
      const meaning=String(it.meaning||'').replace(/[`$\\]/g,'').trim().slice(0,160); if(!meaning) return;
      let emoji=String(it.emoji||'').trim(); if(PINKISH.test(emoji)||emoji.length>8) emoji='';
      const grp=groupOf(w);
      const look=(Array.isArray(it.lookalikes)?it.lookalikes:[]).map(s=>String(s).trim().toLowerCase()).filter(x=>/^[a-z]{2,20}$/.test(x)&&x!==w&&!groupOf(x).some(y=>grp.includes(y))).slice(0,2);
      const more=String(it.more||'').replace(/[`$\|]/g,'').trim().slice(0,400);
      fresh.push({w,meaning,emoji,look,more});
    });
    if(!fresh.length){ if(++empty>=3){ gen.msg='Claude couldn’t find more new words for this pack.'; break; } continue; }
    data.words=data.words.concat(fresh).slice(0,PACK_SIZE+20);
    addPackWords(pack, fresh); savePack(pack.id);
    gen.count=data.words.length; if(view==='badges') render();
  }
  data.done = data.words.length>=PACK_SIZE; savePack(pack.id);
  const ok=data.done, msg=gen.msg; gen=null;
  if(ok){ unlockPack(pack); } else { toast(msg); if(view==='badges') render(); }
  return ok;
}

    ${STANDALONE?'<p class="hint">More packs are on the way.</p>':`<p class="hint">${canSample===null?'Checking whether Claude can write new packs here…':canSample?'✅ Claude can write new packs on this device (a few minutes each, the first time).':'⚠️ Claude can’t write new packs on this device. Packs already made still unlock. To make new ones, open this page on claude.ai in Chrome or Edge on a computer, signed in.'}</p>`}
    ${gen?`<div class="panel"><b>${esc((PACKS.find(p=>p.id===gen.id)||{}).name||'')}</b><p>${esc(gen.msg)} ${gen.count} / ${PACK_SIZE}</p><div class="bar"><i style="width:${Math.round(100*gen.count/PACK_SIZE)}%"></i></div><button class="small" type="button" id="genStop">Stop for now</button></div>`:''}
    <div class="bgrid">${PACKS.map(p=>{

      return `<div class="bcard${on?' got':''}"><div class="bhead"><span class="bemoji">${p.emoji}</span><b>${esc(p.name)}</b></div><small>${status}</small>
        ${!on && !blocked ? (full>=packFreeAt()?`<button class="big" type="button" data-unlock="${p.id}">Unlock</button>`:`<button class="small holdbtn" type="button" data-hold="${p.id}"><i class="fill"></i><span>Grown-up: hold to unlock</span></button>`):''}</div>`; }).join('')}</div>`;
}
function startUnlock(id){

}
function wirePacks(){
  stage.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=()=>startUnlock(b.dataset.unlock));
  stage.querySelectorAll('[data-hold]').forEach(b=>{ const fill=b.querySelector('.fill'); let t0=0, raf=0;
    const stop=()=>{ cancelAnimationFrame(raf); t0=0; fill.style.width='0'; };
    const step=()=>{ const p=Math.min(1,(performance.now()-t0)/1500); fill.style.width=(p*100)+'%'; if(p>=1){ stop(); startUnlock(b.dataset.hold); } else raf=requestAnimationFrame(step); };
    b.addEventListener('pointerdown',e=>{ e.preventDefault(); t0=performance.now(); raf=requestAnimationFrame(step); });
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
    b.addEventListener('click',e=>{ if(e.detail===0) startUnlock(b.dataset.hold); }); });
  const gs=$('#genStop'); if(gs) gs.onclick=()=>{ if(gen){ gen.cancel=true; gen.msg='Stopped. Tap Unlock again to carry on.'; } };

/* =================== Picking words ===================
   A round is a set number of words, one at a time. New words come in list order.
   Every 4th word is one she has met before and hasn't finished, so it comes back later. */
let sess=null;
function newRound(mode){ sess={mode:mode||'main', list:[], done:0, limit:state.perRound}; }
const unfinished=()=>Object.keys(state.words).filter(w=>BY[w] && state.words[w].seen>0 && phaseOf(w)<3);
const spellReady=()=>Object.keys(state.words).filter(w=>BY[w] && state.words[w].read && state.words[w].know && !state.words[w].spell);
/* Next word: words she put in her queue come first, then new words in list order (most useful first),
   with a word she hasn't finished coming back every 4th word. */
function nextWord(){
  const inRound=new Set(sess.list);
  if(sess.mode==='spell'){
    const c=spellReady().filter(w=>!inRound.has(w)).sort((a,b)=>state.words[a].last-state.words[b].last);
    return c[0]||null;
  }
  const q=(state.queue||[]).find(w=>BY[w] && !inRound.has(w));
  if(q) return q;
  const due=reviewDue().filter(d=>!inRound.has(d.w));
  if(due.length && (sess.reviews||0)<2 && (sess.list.length+1)%4===0){ sess.reviews=(sess.reviews||0)+1; sess.reviewWord=due[0].w; sess.reviewKind=due[0].kind; return due[0].w; }
  const old=unfinished().filter(w=>!inRound.has(w)).sort((a,b)=>state.words[a].last-state.words[b].last);
  if(old.length && (sess.list.length+1)%5===0) return old[0];
  /* Mostly medium and "wow" words; an easy word only now and then. */
  const fresh=s=>{ const e=AW().find(e=>STREAMS[s].includes(e.tier) && !(state.words[e.w]&&state.words[e.w].seen) && !inRound.has(e.w)); return e?e.w:null; };
  for(let i=0;i<MIX.length;i++){ const k=(state.mixAt||0)%MIX.length; state.mixAt=k+1; const w=fresh(MIX[k]); if(w) return w; }
  return old[0]||null;
}
const STREAMS={easy:[0], tricky:[1], every:[2], wow:[3]};
const MIX=['every','wow','tricky','wow','every','wow','easy'];

/* =================== One word ===================
   Steps: readcheck -> (✓) readtest -> know -> (✓) knowcheck -> (she read it and knows it) spell.
   ✗ on reading skips the test. ✗ on "know" explains it and moves on. No spelling until she reads it and knows it.
   After a right answer she chooses "I'm sure" (it moves up) or "Test me again" (it stays to practise).
   A word she queued herself goes through every step again, and her answers replace the old ones. */
let view='start', cur=null, afterGrown=null, timers=[];
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
function later(fn,ms){ timers.push(setTimeout(fn,ms)); }

function startWord(w, prefix){
  const r=rec(w); r.seen++; r.last=Date.now();
  sess.since=(sess.since||0)+1;
  const full=(state.queue||[]).includes(w);
  state.queue=(state.queue||[]).filter(x=>x!==w);
  sess.list.push(w); countWord(); save();
  cur={w, e:BY[w], prefix:prefix||null, full, review: sess.reviewWord===w};
  if(cur.review){ sess.reviewWord=null; if(sess.reviewKind==='mean'){ cur.review=false; cur.mreview=true; cur.mi=0; return goStep('know'); } return goStep('spell'); }
  if(sess.mode==='spell') return goStep('spell');
  if(full || !r.read) return goStep('readcheck');
  if(!r.know) return goStep('know');
  if(!r.spell) return goStep('spell');
  nextOne();
}
/* After the reading part: ask about meaning if still needed, spell if she can read it and knows it, else next word. */
function afterRead(){ goStep('know'); }
function afterKnow(){
  const r=rec(cur.w);
  if(r.read && r.know && (cur.full || !r.spell)) return goStep('spell');
  nextOne();
}
/* The first thing said for a word can carry a greeting in front ("Hi!"), said straight from the tap. */
function sayStep(items, opts){ const p=(cur&&cur.prefix)||[]; if(cur) cur.prefix=null; return say(p.concat(items), opts); }
function goStep(step){
  clearTimers(); hush();
  cur.step=step; cur.answered=false; cur.spellPhase=null; cur.spellResult=null; cur.typed=''; view='word'; render();
  const w=cur.w;
  if(step==='readcheck') sayStep(['Can you read this word?']);
  if(step==='readtest') sayOptions();
  if(step==='know') sayStep([cur.mreview?`Do you remember what ${w} means?`:`Do you know what ${w} means?`]);
  if(step==='knowcheck'){ const i=cur.mi||0; if(i>=nMeanings(cur.e)) say(alikeLines(cur.e).concat([{pause:500},'Do you know the difference?'])); else say(meaningLines(cur.e,i).concat([{pause:500}, i?'Did you know that one too?':'Is that what you thought?'])); }
  if(step==='explain') say(explainLines(cur.e));
}
function nextOne(counted){
  clearTimers(); hush();
  if(counted!==false) sess.done++;
  if(sess.done>=sess.limit){ finishRound(); return; }
  if(sess.mode==='cloud'){ const ws=cloudWords(10); if(ws.length<3){ finishRound(); return; } return startCloud(ws); }
  if(sess.mode==='main' && sess.phraseDue){ sess.phraseDue=false; const P=nextPhrase(); if(P) return startPhrase(P,'flow'); }
  if(sess.mode==='main' && sess.lessonDue){ sess.lessonDue=false; const L=nextLesson(); if(L) return startLesson(L,'flow'); }
  if(sess.mode==='main' && (sess.since||0)>=2){ const ws=cloudWords(); if(ws.length>=4){ sess.since=0; return startCloud(ws); } }
  const w=nextWord();
  if(!w){ finishRound(); return; }
  startWord(w);
}

/* =================== Word cloud ===================
   After every 2 single words: 6 new words at once, easy and harder mixed, not read aloud (quicker).
   She drags each word (or taps it, then taps a box) into one of 3 moons:
   Not yet = stays as it is; I can read it = reads and knows it (half moon); Read and spell = full moon. */
function cloudWords(size){
  size=size||6;
  const inRound=new Set(sess.list), q=new Set(state.queue||[]), shown=sess.cloudSeen||(sess.cloudSeen=new Set()), out=[];
  const take=(tiers,n)=>{ AW().filter(e=>tiers.includes(e.tier) && !(state.words[e.w]&&state.words[e.w].seen) && !inRound.has(e.w) && !q.has(e.w) && !shown.has(e.w) && !out.includes(e.w)).slice(0,n).forEach(e=>out.push(e.w)); };
  if(size>=10){ take([0],3); take([1],2); take([2],3); take([3],2); } else { take([0],2); take([1],1); take([2],2); take([3],1); }
  if(out.length<size) take([0,1,2,3],size-out.length);
  out.forEach(w=>shown.add(w));
  return shuffle(out);
}
const ZONES=[{p:0,n:'Not yet',s:'leave it for now'},{p:2,n:'I can read it',s:'and I know what it means'},{p:3,n:'Read and spell',s:'I can do it all'}];
function startCloud(ws){
  clearTimers(); hush();
  cur={cloud:ws, placed:{}, sel:null, look:ws.map(()=>({size:22+Math.floor(Math.random()*13), tilt:(Math.random()*8-4).toFixed(1)}))};
  view='cloud'; render();
  say([sess&&sess.mode==='cloud'&&sess.done===0?'Word clouds! Put each word in the right moon.':'Word cloud! Put each word in the right moon.'],{noRemember:true});
}
function renderCloud(){
  const left=cur.cloud.filter(w=>!(w in cur.placed));
  stage.innerHTML=`<section class="stage" style="gap:10px"><span class="tag">☁️ Word cloud</span>
      <p class="hint">Drag each word to a moon, or tap a word and then tap a moon. Hold a word to hear it and see what it means.</p></section>
    <div class="cloud">${cur.cloud.map((w,i)=>(w in cur.placed)?'':`<button class="cw${cur.sel===w?' sel':''}" type="button" data-cw="${esc(w)}" style="font-size:${cur.look[i].size}px;transform:rotate(${cur.look[i].tilt}deg)">${esc(w)}</button>`).join('')}
      ${left.length?'':'<p class="pop" style="font-family:var(--font-display);font-size:28px;color:var(--good)">All sorted!</p>'}</div>
    <div class="zones">${ZONES.map((z,i)=>{ const got=cur.cloud.filter(w=>cur.placed[w]===i); return `<button class="zone" type="button" data-zone="${i}"><b>${PILES[z.p].m}</b><span>${z.n}</span><small>${z.s}</small>${got.length?`<span class="got">${got.map(esc).join(', ')}</span>`:''}</button>`; }).join('')}</div>
    <div class="row center"><button class="soft" type="button" id="cloudDone">${left.length?'Done for now ➜':'Next ➜'}</button></div>
    <div class="wpop" id="cpop" hidden></div>`;
  wireCloud();
}
function openCloudPop(w){
  const p=$('#cpop'), e=BY[w]; if(!p||!e) return;
  p.innerHTML=`<div class="popcard" role="dialog" aria-modal="true" aria-label="${esc(w)}">
      <div class="bigword">${esc(w)}</div>
      <button class="soft" type="button" id="cListen">🔊 Listen</button>
      <div class="explain">${explainHTML(e)}</div>${moreBtn(e)}
      <button class="soft" type="button" id="cClose">✕ Close</button></div>`;
  p.hidden=false;
  $('#cListen').onclick=()=>say([w],{noRemember:true,need:true});
  wireMore(e);
  const close=()=>{ p.hidden=true; p.innerHTML=''; hush(); };
  $('#cClose').onclick=close; p.onclick=ev=>{ if(ev.target===p) close(); };
}
function zoneAt(x,y){ const el=document.elementFromPoint(x,y); return el&&el.closest?el.closest('.zone'):null; }
function hotZone(z){ stage.querySelectorAll('.zone').forEach(el=>el.classList.toggle('hot',el===z)); }
function wireCloud(){
  stage.querySelectorAll('.cw').forEach(el=>{
    el.addEventListener('pointerdown',ev=>{
      ev.preventDefault(); const w=el.dataset.cw, sx=ev.clientX, sy=ev.clientY; let ghost=null, held=false;
      try{ el.setPointerCapture(ev.pointerId); }catch(e){}
      /* hold still for half a second: open the word's pop-up (listen + meaning) */
      const holdT=setTimeout(()=>{ held=true; el.classList.add('held'); openCloudPop(w); },550);
      const move=e=>{
        if(held) return;
        if(!ghost && Math.hypot(e.clientX-sx,e.clientY-sy)>8){ clearTimeout(holdT); ghost=el.cloneNode(true); ghost.classList.add('drag'); ghost.style.transform=''; document.body.appendChild(ghost); el.style.opacity='.3'; }
        if(ghost){ ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px'; hotZone(zoneAt(e.clientX,e.clientY)); }
      };
      const up=e=>{
        el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up);
        clearTimeout(holdT); el.classList.remove('held');
        if(held) return;
        if(ghost){ ghost.remove(); el.style.opacity=''; const z=zoneAt(e.clientX,e.clientY); hotZone(null); if(z && e.type==='pointerup') dropWord(w,+z.dataset.zone); }
        else if(e.type==='pointerup'){ cur.sel = cur.sel===w ? null : w; renderCloud(); }
      };
      el.addEventListener('pointermove',move); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
    });
    el.addEventListener('click',e=>{ if(e.detail===0){ cur.sel = cur.sel===el.dataset.cw ? null : el.dataset.cw; renderCloud(); } });
    el.addEventListener('contextmenu',e=>e.preventDefault());
  });
  stage.querySelectorAll('.zone').forEach(z=>z.onclick=()=>{ if(cur.sel) dropWord(cur.sel,+z.dataset.zone); });
  $('#cloudDone').onclick=()=>nextOne(sess.mode==='cloud');
}
function dropWord(w, zi){
  if(!cur || !cur.cloud || (w in cur.placed)) return;
  const r=rec(w); r.seen++; r.last=Date.now(); r.cloud=(r.cloud||0)+1; countWord();
  if(zi===1){ r.read=1; r.know=1; }
  if(zi===2){ r.read=1; r.know=1; r.spell=1; }
  cur.placed[w]=zi; cur.sel=null; save();
  chime(zi===2?'full':zi===1?'good':'try');
  renderCloud();
  if(cur.cloud.every(x=>x in cur.placed)){ say(['All sorted!'],{noRemember:true}); later(()=>{ if(view==='cloud') nextOne(sess.mode==='cloud'); },1600); }
}


function readOptions(w){
  const grp=groupOf(w);
  let opts=(LOOK[w]||[]).filter(x=>x && x!==w && !groupOf(x).some(y=>grp.includes(y)));
  if(opts.length<2){ /* back-up: look-alikes from the list itself */
    const A=new Set([...w].map((c,i)=>w.slice(i,i+2)));
    const more=WORDS.map(o=>o.w).filter(x=>x!==w && !opts.includes(x) && !groupOf(x).some(y=>grp.includes(y)))
      .map(x=>({x,s:(x[0]===w[0]?3:0)+(Math.abs(x.length-w.length)<=1?2:0)+[...x].filter((c,i)=>A.has(x.slice(i,i+2))).length+Math.random()}))
      .sort((a,b)=>b.s-a.s).slice(0,2-opts.length).map(o=>o.x);
    opts=opts.concat(more);
  }
  return shuffle([w].concat(opts.slice(0,2)));
}
function lightDot(i){ stage.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===i)); }
function sayOptions(){
  const o=cur.opts, items=['Which one is it? Listen.', {pause:700}];
  o.forEach((x,i)=>{ items.push({fn:()=>lightDot(i)}, x+'.', {pause:800}); });
  items.push({fn:()=>lightDot(-1)}, 'Tap the right dot.');
  sayStep(items,{need:true});
}
/* Words can have more than one meaning (meanings.txt). Meaning 0 is the main one. */
const nMeanings=e=>1+((e.more||[]).length);
const nChecks=e=>nMeanings(e)+(e.alike?1:0);
const spellOut=w=>w.replace(/[^a-z]/gi,'').toUpperCase().split('').join(', ');
function alikeLines(e){
  const others=e.alike.filter(g=>g.w!==e.w).map(g=>g.w);
  const out=[`Careful! ${cap(e.w)} sounds the same as ${others.join(' and ')}.`];
  e.alike.forEach(g=>{ out.push({pause:600}, `${g.w}: spelled ${spellOut(g.w)}, means ${g.meaning}.`); });
  return out;
}
function alikeHTML(e){
  return `<div class="alike"><p class="hint">\u26A0\uFE0F Careful! These sound the same:</p>${e.alike.map(g=>`<div class="alrow${g.w===e.w?' me':''}"><span class="alw">${esc(g.w)}</span><span class="alm">${g.emoji?g.emoji+' ':''}${esc(g.meaning)}</span></div>`).join('')}</div>`;
}
function meaningLines(e,i){
  if(i>0){ const m=e.more[i-1]; return [`${cap(e.w)} can also mean: ${m.meaning}.`]; }
  if(e.t==='p') return [`This is a ${e.w}.`];
  if(e.t==='m') return [`${cap(e.w)} means ${e.meaning}.`];
  return [`We use ${e.w} like this.`, {pause:500}, e.sentence.replace('___',e.w)];
}
function meaningHTML(e,i){
  const w=e.w;
  if(i>0){ const m=e.more[i-1]; return `${m.emoji?`<div class="em">${m.emoji}</div>`:''}<p><b>${esc(w)}</b> can also mean ${esc(m.meaning)}.</p>`; }
  return e.t==='p' ? `<div class="em">${e.emoji}</div><p>This is a <b>${esc(w)}</b>.</p>`
    : e.t==='m' ? `${e.emoji?`<div class="em">${e.emoji}</div>`:''}<p><b>${esc(w)}</b> means ${esc(e.meaning)}.</p>`
    : `<p>${esc(e.sentence).replace('___',`<b>${esc(w)}</b>`)}</p>`;
}
function explainLines(e){
  const extra=e.alike?[{pause:700}].concat(alikeLines(e)):[];
  const n=nMeanings(e); if(n===1) return meaningLines(e,0).concat(extra);
  let out=[`${cap(e.w)} has ${n} meanings.`,{pause:500}];
  for(let i=0;i<n;i++){ if(i) out.push({pause:600}); out=out.concat(meaningLines(e,i)); }

}
function explainHTML(e){
  const extra=e.alike?alikeHTML(e):'';
  const n=nMeanings(e); if(n===1) return meaningHTML(e,0)+extra;
  return `<p class="hint">${n} meanings</p>`+Array.from({length:n},(_,i)=>`<div class="mean">${meaningHTML(e,i)}</div>`).join('')+extra;
}
/* "Tell me more": a deeper explanation for bigger words */
const moreBtn=e=>e.deep?`<button class="small more" type="button" id="moreBtn">\uD83D\uDCD6 Tell me more</button><div class="deep" id="deep" hidden></div>`:'';
function wireMore(e){
  const b=$('#moreBtn'); if(!b) return;
  b.onclick=()=>{ const d=$('#deep'); d.textContent=e.deep; d.hidden=false; b.hidden=true; say([e.deep],{noRemember:true,need:true}); try{ d.scrollIntoView({block:'nearest',behavior:'smooth'}); }catch(err){} };
}
/* "I'm sure" / "Test me again" buttons */
const threeHTML=(a,b,c)=>`<div class="row center sureRow"><button class="sure" type="button" id="sure">${a}</button><button class="again" type="button" id="remember">${b}</button><button class="nope" type="button" id="again">${c}</button></div>`;
const sureHTML=(sureText, againText)=>`<div class="row center sureRow"><button class="sure" type="button" id="sure">${sureText||'I’m sure ✓'}</button><button class="again" type="button" id="again">${againText||'Test me again ↻'}</button></div>`;

function renderWord(){
  const w=cur.w, e=cur.e, s=cur.step;
  let html='';
  const allBtn=(s==='readcheck'||s==='know') ? `<button class="knowall" type="button" id="knowall">⭐ I know it all</button>` : '';
  if(s==='readcheck'){
    html=`<span class="tag">👀 Can you read it?</span><div class="bigword">${esc(w)}</div>
      <div class="yn"><button class="ynb no" type="button" id="no" aria-label="No, I can't read it">✗</button><button class="ynb yes" type="button" id="yes" aria-label="Yes, I can read it">✓</button></div>`;
  } else if(s==='readtest'){
    html=`<div class="bigword">${esc(w)}</div><p class="ask">Which one is it?</p>
      <div class="dots">${cur.opts.map((o,i)=>`<button class="dot c${i}" type="button" data-dot="${i}" aria-label="Choice ${i+1}"></button>`).join('')}</div>

      <div class="yn"><button class="ynb no" type="button" id="no" aria-label="No, I don't know what it means">✗</button><button class="ynb yes" type="button" id="yes" aria-label="Yes, I know what it means">✓</button></div>
      <button class="small" type="button" id="skipKnow">Skip, I know it ➜</button>`;

    } else {

        ${i?threeHTML('Yes, I knew that too ✓','Still remembering 🔁','I didn\u2019t know that ✗'):threeHTML(cur.mreview?'I remembered ✓':'Yes, I knew it ✓','Still remembering 🔁','I didn\u2019t know that ✗')}${moreBtn(e)}`;
    }
  } else if(s==='explain'){

      <button class="big" type="button" id="nextBtn">Next word ➜</button>`;
  } else if(s==='spell'){
    const phase=cur.spellPhase||'look';
    if(phase==='look') html=`<span class="tag">${cur.review?'🔁 Check-up: spell it':'✏️ Spell it'}</span><p class="ask">Look carefully…</p><div class="bigword">${esc(w)}</div><div class="timer"><i style="--t:2.5s"></i></div>`;
    else if(phase==='gone') html=`<span class="tag">✏️ Spell it</span><p class="ask">Picture it in your head…</p><div class="bigword ghost" aria-hidden="true">${esc(w)}</div>`;
    else {
      const typed=cur.typed||'';
      const keys='abcdefghijklmnopqrstuvwxyz'.split('');
      html=`<span class="tag">✏️ Spell it</span><div class="typed${cur.spellResult==='right'?' right':cur.spellResult==='wrong'?' wrong':''}" id="typed">${esc(typed)||'&nbsp;'}</div>`
        +(cur.spellResult?'':`<div class="kb" id="kb">${keys.map(k=>`<button class="key" type="button" data-k="${k}">${k}</button>`).join('')}
          <button class="key wide" type="button" id="bk" aria-label="Rub out">⌫</button><button class="key wide go" type="button" id="check">✓ Done</button></div>`);
    }
    if(!cur.spellResult) html+=`<div class="row center"><button class="small" type="button" id="skip">Skip spelling for now ➜</button></div>`;
  }
  stage.innerHTML=`<section class="stage">${allBtn}${html}<div class="fb" id="fb"></div></section>`;
  wireWord();
}
function wireWord(){
  const s=cur.step, w=cur.w;
  const y=$('#yes'), n=$('#no');
  const ka=$('#knowall'); if(ka) ka.onclick=()=>knowAll();
  if(s==='readcheck'){
    y.onclick=()=>{ cur.opts=readOptions(w); goStep('readtest'); };
    n.onclick=()=>{ const r=rec(w); if(cur.full){ r.read=0; save(); }
      goStep('know'); };
  }
  if(s==='know'){
    y.onclick=()=>{ cur.mi=0; cur.stillRem=false; goStep('knowcheck'); };
    $('#skipKnow').onclick=()=>{ const r=rec(w); r.know=1; r.mdue=null; r.mbox=null; save(); moonsBar(); chime('good'); afterKnow(); };
    n.onclick=()=>{ const r=rec(w); r.know=0; save(); moonsBar(); goStep('explain'); };
  }
  if(s==='knowcheck'){
    const nextCheck=()=>{ const i=cur.mi||0;
      if(i+1<nChecks(cur.e)){ cur.mi=i+1; chime('good'); goStep('knowcheck'); return; }
      const r=rec(w); r.know=1;
      if(cur.stillRem){ if(cur.mreview) passMeaning(r); else { r.mbox=0; r.mdue=Date.now()+REVIEW[0]; } }
      else { r.mdue=null; r.mbox=null; }   /* she knew it: trusted, no check-up */
      save(); moonsBar(); chime('good');
      if(cur.mreview){ feedback('good', cur.stillRem?'OK, we\u2019ll check again later':'Banked for good!'); later(()=>nextOne(),1300); return; }
      afterKnow(); };
    $('#sure').onclick=nextCheck;
    $('#remember').onclick=()=>{ cur.stillRem=true; nextCheck(); };
    $('#again').onclick=()=>{ const r=rec(w); r.know=0; r.mdue=null; r.mbox=null; r.knowAgain=(r.knowAgain||0)+1; save(); moonsBar(); say(['OK, I’ll ask you again later.'],{noRemember:true}); later(()=>nextOne(),1400); };
  }
  if(s==='explain'){ $('#nextBtn').onclick=()=>nextOne(); }
  if(s==='knowcheck'||s==='explain') wireMore(cur.e);
  stage.querySelectorAll('[data-dot]').forEach(b=>b.onclick=()=>answerRead(+b.dataset.dot));
  const sr=$('#skipRead'); if(sr) sr.onclick=()=>{ if(cur.answered) return; cur.answered=true; const r=rec(w); r.read=1; save(); moonsBar(); chime('good'); afterRead(); };
  if(s==='spell'){
    if(!cur.spellPhase){ cur.spellPhase='look'; sayStep(['Look carefully. Then spell it.']);
      later(()=>{ cur.spellPhase='gone'; renderWord(); },2500);
      later(()=>{ cur.spellPhase='type'; cur.typed=''; renderWord(); say([`Now spell ${w}.`],{need:true}); },4000); }
    stage.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>typeKey(b.dataset.k));
    const bk=$('#bk'); if(bk) bk.onclick=()=>typeKey('back');
    const ck=$('#check'); if(ck) ck.onclick=checkSpell;
    const ss=$('#skipSpell'); if(ss) ss.onclick=()=>{ const r=rec(w); if(cur.review) passReview(r); r.spell=1; r.spellSkipSure=(r.spellSkipSure||0)+1; save(); moonsBar(); chime('full'); clearTimers(); hush(); feedback('good','Full moon!',`<p class="move">${PILES[3].m} <b>${esc(w)}</b></p>`); later(()=>nextOne(),700); };
    const sk=$('#skip'); if(sk) sk.onclick=()=>{ const r=rec(w); r.skips=(r.skips||0)+1; save(); nextOne(); };
  }
}
/* "I know it all": she can read it, knows it and can spell it. Bank it as a full moon and move straight on. */
function knowAll(){
  const r=rec(cur.w); r.read=1; r.know=1; r.spell=1; r.spellTested=0; r.due=null; r.mdue=null; r.knowAll=(r.knowAll||0)+1; save();
  clearTimers(); hush(); chime('full'); moonsBar();
  stage.querySelectorAll('button').forEach(b=>b.disabled=true);
  feedback('good','Full moon!',`<p class="move">${PILES[3].m} <b>${esc(cur.w)}</b></p>`);
  later(()=>nextOne(false),450);
}
function feedback(kind, text, extra){ const fb=$('#fb'); if(fb){ fb.innerHTML=`<p class="say ${kind} pop">${text}</p>${extra||''}`; try{ fb.scrollIntoView({block:'nearest',behavior:'smooth'}); }catch(e){} } }

function answerRead(i){
  if(cur.answered) return; cur.answered=true; hush();
  const ok=cur.opts[i]===cur.w, ci=cur.opts.indexOf(cur.w);
  stage.querySelectorAll('.dot').forEach((d,j)=>{ d.classList.remove('on'); d.disabled=true; if(j===ci) d.classList.add('right'); else if(j===i) d.classList.add('wrong'); else d.classList.add('fade'); });
  const h=$('#dotHint'); if(h) h.hidden=true; const sr2=$('#skipRead'); if(sr2) sr2.hidden=true;
  const w=cur.w, r=rec(w);
  if(ok){ chime('good'); const c=pick(['Well done!','That’s right!','Yes!','Great job!','You got it!']);
    feedback('good',c+' You read it.', sureHTML());
    $('#sure').onclick=()=>{ r.read=1; save(); moonsBar(); afterRead(); };
    $('#again').onclick=()=>{ r.read=0; r.readAgain=(r.readAgain||0)+1; save(); moonsBar(); afterRead(); };
    say([c+' You read it.', {pause:400}, 'Are you sure? Or shall I test you again later?'],{noRemember:true});
  } else {
    if(cur.full){ r.read=0; } save(); moonsBar();
    chime('try'); feedback('try','Good try!',`<p class="move">It says <b>${esc(w)}</b>.</p>`);
    const goOn=()=>{ if(view==='word' && cur && cur.w===w && cur.step==='readtest') afterRead(); };
    Promise.race([say([`Good try. This word says ${w}.`],{noRemember:true}),wait(3000)]).then(()=>wait(400)).then(goOn);
  }
}
function typeKey(k){
  if(!cur || cur.step!=='spell' || cur.spellPhase!=='type' || cur.spellResult) return;
  if(k==='back') cur.typed=(cur.typed||'').slice(0,-1);
  else if((cur.typed||'').length<20) cur.typed=(cur.typed||'')+k;
  const t=$('#typed'); if(t) t.innerHTML=esc(cur.typed)||'&nbsp;';
}
function checkSpell(){
  if(!cur.typed || cur.spellResult) return;
  const w=cur.w, ok=cur.typed.toLowerCase()===w.toLowerCase(), r=rec(w);
  cur.spellResult=ok?'right':'wrong';
  renderWord();
  if(ok){ chime('good');
    r.spellStreak=(r.spellStreak||0)+1;
    const need=cur.review?1:(r.spellMiss?2:1);
    if(r.spellStreak<need){ save();
      feedback('good','That\u2019s right!',`<p class="move">This word was tricky before, so spell it right once more another time to fill the moon.</p><button class="big" type="button" id="nextBtn">Next word ➜</button>`);
      $('#nextBtn').onclick=()=>nextOne();
      say(['That\u2019s right!', {pause:300}, 'This word was tricky before, so I\u2019ll ask you to spell it once more another time.'],{noRemember:true});
      return; }
    const c=pick(['Well done!','That’s right!','Great job!']);
    feedback('good',c+' You spelled it!', sureHTML());
    if(cur.review){
      $('#sure').onclick=()=>{ chime('full'); feedback('good','Still a full moon!',`<p class="move">${PILES[3].m} <b>${esc(w)}</b></p><div class="row center"><button class="sure" type="button" id="bank">⭐ Bank it for good</button><button class="again" type="button" id="later2">🔁 Check me again later</button></div>`);
        say(['Still a full moon!', {pause:300}, 'Bank it for good, or check it again later?'],{noRemember:true});
        $('#bank').onclick=()=>{ r.reviewDone=1; r.due=null; r.lastCheck=Date.now(); save(); moonsBar(); toast(`⭐ ${w} is banked for good!`); nextOne(); };
        $('#later2').onclick=()=>{ passReview(r); save(); moonsBar(); toast(r.due?`🔁 Next check-up for ${w}: ${shortDate(r.due)}`:`⭐ ${w} is banked for good!`); nextOne(); }; };
      $('#again').onclick=()=>{ failReview(r); save(); moonsBar(); nextOne(); };
      say([c+' You spelled it.', {pause:400}, 'Are you sure? Or shall I test you again later?'],{noRemember:true});
      return;
    }
    $('#sure').onclick=()=>{ r.spell=1; r.spellTested=1; r.reviewDone=0; r.due=null; save(); moonsBar(); chime('full');
      feedback('good','Full moon!',`<p class="move">${PILES[3].m} <b>${esc(w)}</b>: you read it, know it and spell it!</p>`);
      Promise.race([say([cap(w)+' is a full moon word!'],{noRemember:true}),wait(3000)]).then(()=>wait(300)).then(()=>{ if(view==='word' && cur && cur.w===w) nextOne(); }); };
    $('#again').onclick=()=>{ r.spell=0; r.spellAgain=(r.spellAgain||0)+1; save(); moonsBar(); nextOne(); };
    say([c+' You spelled it.', {pause:400}, 'Are you sure? Or shall I test you again later?'],{noRemember:true});
  } else {
    r.spellStreak=0;
    if(cur.review) failReview(r); else r.spellMiss=(r.spellMiss||0)+1;
    if(cur.full) r.spell=0; save(); moonsBar(); chime('try');
    feedback('try','Good try!',`<p class="move">It’s spelled <b>${esc(w)}</b></p><button class="big" type="button" id="nextBtn">Next word ➜</button>`);
    $('#nextBtn').onclick=()=>nextOne();
    say([`Good try. ${cap(w)} is spelled:`, {pause:300}, w.split('').map(c=>c.toUpperCase()).join(', ')+'.'],{noRemember:true});
  }
}

/* =================== My words: four columns of moons ===================
   Left to right: full moons (reads, knows, spells) | half moons (reads + knows) | crescents (knows, or reads) | not tried yet.
   Headings sit at the bottom; moons stack upwards, the next words nearest the heading. Tap a moon to see and hear the word. */
let wordsFrom='start', popWord=null;
function openWords(from){ clearTimers(); hush(); wordsFrom=from||'start'; popWord=null; view='words'; render();
  requestAnimationFrame(()=>{ try{ window.scrollTo(0, document.body.scrollHeight); }catch(e){} }); }
const COLS=[{p:3,n:'Yay! All three',s:'reads, knows and spells'},{p:2,n:'Knows + reads',s:''},{p:1,n:'Knows it',s:'or reads it'},{p:0,n:'Not yet',s:'still a mystery'}];
function renderWords(){
  const q=new Set(state.queue||[]);
  const byPhase={0:[],1:[],2:[],3:[]};
  AW().forEach(e=>byPhase[phaseOf(e.w)].push(e.w));
  const cols=COLS.map(c=>`<div class="col"><div class="mgrid">${byPhase[c.p].map(w=>`<button class="mb${q.has(w)?' queued':''}" type="button" data-w="${esc(w)}" aria-label="${esc(w)}">${PILES[c.p].m}</button>`).join('')}</div></div>`).join('');
  const heads=COLS.map(c=>`<div class="colhead"><b>${PILES[c.p].m} ${byPhase[c.p].length}</b><span>${c.n}</span>${c.s?`<small>${c.s}</small>`:''}</div>`).join('');
  const queue=(state.queue||[]).filter(w=>BY[w]);
  stage.innerHTML=`<section class="wordsTop">
      <button class="soft" id="wback" type="button">← Back</button>
      <div class="qbox"><b>My queue${queue.length?` (${queue.length})`:''}</b>${queue.length?`<div class="chips left">${queue.map(w=>`<button class="chip" type="button" data-unq="${esc(w)}" aria-label="Take ${esc(w)} out of the queue">${esc(w)} ✕</button>`).join('')}</div>`:'<p class="hint">Tap a moon, then “Add to my queue”. Those words come next.</p>'}</div>
    </section>
    ${practiceHTML()}
    <div class="board">${cols}</div>
    <div class="heads">${heads}</div>
    <div class="wpop" id="pop" hidden></div>`;
  $('#wback').onclick=()=>{ hush(); window.scrollTo(0,0);
    if(wordsFrom==='word' && sess && cur) return resumeWord();
    if(wordsFrom==='cloud' && sess && cur && cur.cloud){ view='cloud'; return render(); }
    view=wordsFrom==='end'&&sess?'end':'start'; render(); };
  stage.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>openPop(b.dataset.w));
  stage.querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>openPop(b.dataset.pw));
  stage.querySelectorAll('[data-unq]').forEach(b=>b.onclick=()=>{ state.queue=(state.queue||[]).filter(x=>x!==b.dataset.unq); save(); renderWords(); });
}
const STATUS=['Not tried yet','','You can read it and you know what it means','You can read it, you know it and you can spell it!'];
function openPop(w, silent){
  popWord=w; const p=$('#pop'), r=state.words[w], ph=phaseOf(w);
  const status= ph===1 ? (r.know?'You know what it means. Next: reading it.':'You can read it. Next: what it means.') : STATUS[ph];
  const inQ=(state.queue||[]).includes(w);
  p.innerHTML=`<div class="popcard" role="dialog" aria-modal="true" aria-label="${esc(w)}">
      <div class="bigword">${esc(w)}</div>
      <p class="hint">${PILES[ph].m} ${esc(status)}</p>
      <button class="soft" type="button" id="pSay">🔊 Say it again</button>
      <details class="pmean"><summary>What does it mean?</summary><div class="explain">${explainHTML(BY[w])}</div>${moreBtn(BY[w])}</details>
      <div class="row center">
        <button class="soft${inQ?' inq':''}" type="button" id="pQ">${inQ?'✓ In my queue (tap to take out)':'➕ Add to my queue'}</button>
        <button class="soft" type="button" id="pClose">✕ Close</button>
        ${ph<3?`<button class="soft up" type="button" id="pUp">${PILES[ph+1].m} ${esc(UPTEXT[ph])}</button>`:''}
      </div>
    </div>`;
  p.hidden=false;
  $('#pSay').onclick=()=>say([w],{noRemember:true,need:true});
  $('#pQ').onclick=()=>{ const qq=state.queue||(state.queue=[]); if(qq.includes(w)) state.queue=qq.filter(x=>x!==w); else { qq.push(w); chime('good'); } save(); renderWords(); openPop(w,true); };
  $('#pClose').onclick=closePop;
  const pm=p.querySelector('.pmean'); if(pm) pm.addEventListener('toggle',()=>{ if(pm.open) say(explainLines(BY[w]),{noRemember:true,need:true}); });
  wireMore(BY[w]);
  const up=$('#pUp'); if(up) up.onclick=()=>{ moveUp(w); chime(phaseOf(w)===3?'full':'good'); save(); renderWords(); openPop(w,true); };
  p.onclick=ev=>{ if(ev.target===p) closePop(); };
}
/* "Move up a moon": she is sure, so the word goes one column along.
   New -> crescent (she knows what it means); crescent -> half (reads and knows); half -> full (spells it too). */
const UPTEXT=['I know what it means','I can read it and know it','I can spell it too'];
function moveUp(w){
  const r=rec(w), ph=phaseOf(w);
  if(ph===0){ r.know=1; }
  else if(ph===1){ r.read=1; r.know=1; }
  else if(ph===2){ r.spell=1; }
  r.movedUp=(r.movedUp||0)+1; if(!r.seen) r.seen=1; r.last=Date.now();
}
/* Words she has met but not finished, and full moons waiting for a check-up */
function practiceHTML(){
  const need=w=>{ const r=state.words[w]; return !r.read?'reading':!r.know?'meaning':(r.spellMiss&&!r.spell?'spelling (twice)':'spelling'); };
  const prac=Object.keys(state.words).filter(w=>BY[w]&&state.words[w].seen>0&&phaseOf(w)<3).sort((a,b)=>state.words[b].last-state.words[a].last);
  const cdue=w=>{ const r=state.words[w]; return Math.min(r.spell&&r.due?r.due:Infinity, r.know&&r.mdue?r.mdue:Infinity); };
  const checks=Object.keys(state.words).filter(w=>BY[w]&&cdue(w)<Infinity).sort((a,b)=>cdue(a)-cdue(b));
  const now=Date.now();
  return `<details class="practice"><summary>\uD83D\uDD01 Practising (${prac.length}) \u00B7 Check-ups (${checks.length})</summary>
    ${prac.length?`<p class="hint">Still growing. What\u2019s next for each word:</p><div class="chips left">${prac.map(w=>`<button class="chip" type="button" data-pw="${esc(w)}">${PILES[phaseOf(w)].m} ${esc(w)} <small>${need(w)}</small></button>`).join('')}</div>`:'<p class="hint">Nothing here yet.</p>'}
    ${checks.length?`<p class="hint">Coming back for a check-up (spelling, or meaning she was still remembering):</p><div class="chips left">${checks.map(w=>`<button class="chip" type="button" data-pw="${esc(w)}">${PILES[phaseOf(w)].m} ${esc(w)} <small>${state.words[w].spell&&state.words[w].due?'spelling':'meaning'} · ${cdue(w)<=now?'due now':shortDate(cdue(w))}</small></button>`).join('')}</div>`:''}
  </details>`;
}
function closePop(){ const p=$('#pop'); if(p){ p.hidden=true; p.innerHTML=''; } popWord=null; hush(); }


/* =================== Check-ups (spaced review) ===================
   A full-moon word comes back for a quick spelling check after 10 days, then 10 weeks, then 10 months.
   Pass: the next check is further away. Miss (or "Test me again"): back to half moon, and it needs two right spellings. */
const DAY=864e5, REVIEW=[10*DAY, 70*DAY, 300*DAY];
/* Check-ups only for what she was actually tested on:
   - spelling: a word she spelled right in the spelling test (spellTested) gets at least one check-up; after that she chooses
     "Bank it for good" or "Check me again later".
   - meaning: only words she marked "Still remembering" (mdue).
   Anything she says she knows (I know it all, skips, "I knew it", cloud boxes, Move up a moon) is trusted and never checked. */
function tidyWords(){
  const now=Date.now();
  for(const w in state.words){ const r=state.words[w];
    if(r.spellTested==null) r.spellTested = (r.spellStreak>0) ? 1 : 0;   /* older saves: tested if she ever spelled it in the test */
    if(r.spell && r.spellTested && !r.due && !r.reviewDone){ r.box=0; r.due=now+REVIEW[0]; }
    if((!r.spell || !r.spellTested) && r.due){ r.due=null; r.box=null; }
    if(!r.know && r.mdue){ r.mdue=null; r.mbox=null; }
  }
  checkBadges();
}
const reviewDue=()=>{ const now=Date.now(), out=[];
  Object.keys(state.words).forEach(w=>{ const r=state.words[w]; if(!BY[w]) return;
    if(r.spell && r.due && r.due<=now) out.push({w,kind:'spell',at:r.due});
    else if(r.know && r.mdue && r.mdue<=now) out.push({w,kind:'mean',at:r.mdue}); });
  return out.sort((a,b)=>a.at-b.at); };
function passMeaning(r){ r.mbox=(r.mbox||0)+1; r.mdue = r.mbox>=REVIEW.length ? null : Date.now()+REVIEW[r.mbox]; }
function passReview(r){ r.box=(r.box||0)+1; if(r.box>=REVIEW.length){ r.reviewDone=1; r.due=null; } else r.due=Date.now()+REVIEW[r.box]; r.lastCheck=Date.now(); }
function failReview(r){ r.spell=0; r.spellMiss=(r.spellMiss||0)+1; r.spellStreak=0; r.box=null; r.due=null; r.reviewDone=0; r.lastCheck=Date.now(); }
const shortDate=ms=>new Date(ms).toLocaleDateString([], {day:'numeric', month:'short'});

/* =================== Badges ===================

/* =================== Moon Run ===================
   Unlocks after 30 words worked through. A wolf runs through the forest by full-moon light, seen from above.
   Drag to move left and right, tap to jump (over rocks, logs and holes; trees must be dodged).
   Behind her the darkness follows: if it catches her, she turns back into a human. Lives are one pool: 3 to start, then 1 for every 10 words; when they run out she must earn more.
   5 levels, each faster; at the end of level 5 she reaches the moon. */
const GAME_UNLOCK=30; /* words worked through (any answer counts), including ones from before counting started */
const wordsPlayed=()=>Math.max(state.wordsGone||0, Object.keys(state.words).filter(w=>state.words[w].seen>0).length);
const LEVELS=[{speed:150,goal:900,name:'Moonlit Meadow',bg:'#13301F'},{speed:185,goal:1200,name:'Whispering Woods',bg:'#0F2A1B'},{speed:220,goal:1500,name:'Rocky Ridge',bg:'#1B2622'},{speed:255,goal:1800,name:'Misty Marsh',bg:'#14261F'},{speed:290,goal:2200,name:'The Moon Path',bg:'#101A2A'}];
let G=null, gameFrom='start';
function gameState(){ const g=state.game||(state.game={levelMax:1,lives:3,runs:0});
  if(g.lives==null){ g.lives=3+(g.bank||0); g.bank=0; } /* from older versions: 3 to start plus any bonus lives */
  return g; }
const toNextLife=()=>10-((state.wordsGone||0)%10);
function stopGame(){ if(G){ cancelAnimationFrame(G.raf); G.stopped=true; } G=null; }
function openGame(from){ stopGame(); clearTimers(); hush(); gameFrom=from||'start'; view='game'; render(); window.scrollTo(0,0); }
function renderGame(){

      <p class="sub">🔒 Unlocks after ${GAME_UNLOCK} words. You have done ${done}.</p>
      <div class="bar" style="width:min(320px,80%)"><i style="width:${Math.round(100*done/GAME_UNLOCK)}%"></i></div>
      <p class="hint">Every 10 words you play earns a life. You have ${g.lives||0} 🐾 so far.</p>

  }
  stage.innerHTML=`<section class="gamebox">
      <div class="gtop"><button class="small" id="gback" type="button">← Back</button><span id="ginfo" class="ginfo"></span><span id="glives" class="glives"></span></div>
      <div class="gprog"><i id="gbar"></i><span>🌕</span></div>

      <p class="hint">Drag left and right to run around trees. Tap to jump over rocks, logs and holes. Keys: ← → and space.</p></section>`;
  $('#gback').onclick=()=>{ stopGame(); hush(); view=gameFrom==='end'&&sess?'end':'start'; render(); };
  gameMenu();
}
function gameMenu(msg){
  const g=gameState(), o=$('#gover'); if(!o) return;
  o.innerHTML=`<div class="gcard">${msg||`<h2>🐺 Moon Run</h2><p>Run by the light of the full moon. Don’t let the darkness catch you, or you’ll turn back into a human!</p>`}

    ${(g.lives||0)<=0?'<p><b>No lives left.</b> Play 10 words to earn a life, then come back!</p>':''}
    <div class="row center">${LEVELS.map((L,i)=>`<button class="${i+1===Math.min(g.levelMax||1,5)?'big':'soft'}" type="button" data-lv="${i+1}" ${(i+1>(g.levelMax||1)||(g.lives||0)<=0)?'disabled':''}>${i+1>(g.levelMax||1)?'🔒 ':''}Level ${i+1}</button>`).join('')}</div>
    <p class="hint">${LEVELS.map((L,i)=>`${i+1}. ${L.name}`).join(' · ')}</p></div>`;
  o.hidden=false;

function sizeCanvas(){
  const cv=$('#gc'); if(!cv) return null;
  const W=cv.clientWidth||340, H=Math.round(Math.min(window.innerHeight*0.66, 640, W*1.45));
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.height=H+'px'; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  return {cv,ctx,W,H};
}
function drawIdle(){ const s=sizeCanvas(); if(!s) return; const L=LEVELS[Math.min((gameState().levelMax||1),5)-1];
  const fake={W:s.W,H:s.H,ctx:s.ctx,L,x:s.W/2,wy:s.H*0.64,t:0,jump:0,obs:[],decor:makeDecor(s.W,s.H),dark:0.12,inv:0,state:'idle',moonR:s.W*0.06,scroll:0};
  drawGame(fake); }
function makeDecor(W,H){ const d=[]; for(let i=0;i<40;i++) d.push({x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*5,k:Math.random()<0.15?'flower':'tuft'}); return d; }
function startRun(level){
  if((gameState().lives||0)<=0) return gameMenu();
  const s=sizeCanvas(); if(!s) return;
  const g=gameState(); g.runs=(g.runs||0)+1; save();
  $('#gover').hidden=true;
  stopGame();
  const sc=s.H/600;
  G={level, L:LEVELS[level-1], W:s.W, H:s.H, ctx:s.ctx, cv:s.cv, sc, x:s.W/2, tx:s.W/2, wy:s.H*0.64, dist:0, t:0, jump:0, inv:0, slow:0,
     lives:g.lives||0, dark:0.12, obs:[], decor:makeDecor(s.W,s.H), spawnIn:1.2, state:'run', last:performance.now(), dir:0, moonR:s.W*0.05, scroll:0};
  hudGame();
  say([`Level ${level}. ${G.L.name}. Run!`],{noRemember:true});
  const cv=s.cv; let down=null;
  cv.onpointerdown=e=>{ e.preventDefault(); down={x:e.clientX,y:e.clientY,t:performance.now(),drag:false}; try{ cv.setPointerCapture(e.pointerId); }catch(err){} };
  cv.onpointermove=e=>{ if(!down||!G) return; if(Math.abs(e.clientX-down.x)>10) down.drag=true; if(down.drag){ const r=cv.getBoundingClientRect(); G.tx=e.clientX-r.left; } };
  cv.onpointerup=e=>{ if(!down||!G) return; if(!down.drag && performance.now()-down.t<350) jumpGame(); down=null; };
  cv.onpointercancel=()=>{ down=null; };
  G.raf=requestAnimationFrame(stepGame);
}
const JUMP=1.0;
function jumpGame(){ if(G && G.state==='run' && G.jump<=0.15){ G.jump=JUMP; } }
function hudGame(){
  if(!G) return; const lv=$('#ginfo'), li=$('#glives'), bar=$('#gbar');
  if(lv) lv.textContent=`Level ${G.level}: ${G.L.name}`;
  if(li) li.textContent='🐾'.repeat(Math.max(0,Math.min(G.lives,12)))+(G.lives>12?` ×${G.lives}`:'');
  if(bar) bar.style.width=Math.min(100,100*G.dist/G.L.goal)+'%';
}
function stepGame(now){
  if(!G||G.stopped) return;
  const dt=Math.min(0.05,(now-G.last)/1000); G.last=now; G.t+=dt;
  const W=G.W,H=G.H;
  if(G.state==='run'){
    const spd=G.L.speed*G.sc*(G.slow>0?0.45:1);
    G.slow=Math.max(0,G.slow-dt); G.inv=Math.max(0,G.inv-dt); G.jump=Math.max(0,G.jump-dt);
    if(G.dir) G.tx+=G.dir*W*0.9*dt;
    G.tx=Math.max(W*0.08,Math.min(W*0.92,G.tx)); G.x+=(G.tx-G.x)*Math.min(1,dt*12);
    const dy=spd*dt; G.scroll+=dy; G.dist+=dy/(10*G.sc);
    G.decor.forEach(d=>{ d.y+=dy; if(d.y>H+10){ d.y-=H+20; d.x=Math.random()*W; } });
    G.obs.forEach(o=>o.y+=dy); G.obs=G.obs.filter(o=>o.y<H+80);
    G.dark=Math.max(0.12,G.dark-0.05*dt);
    if(G.dist<G.L.goal-40){ G.spawnIn-=dt; if(G.spawnIn<=0){ spawnObstacles(); G.spawnIn=Math.max(0.45,1.25-0.13*(G.level-1))*(0.75+Math.random()*0.5); } }
    // collisions
    const wr=W*0.05;
    for(const o of G.obs){ if(o.hit) continue;
      let touch=false;
      if(o.type==='log'){ touch=Math.abs(G.x-o.x)<o.w/2+wr*0.6 && Math.abs(G.wy-o.y)<o.h/2+wr*0.6; }
      else touch=Math.hypot(G.x-o.x,G.wy-o.y)<o.r+wr*0.75;
      if(!touch) continue;
      const air=G.jump>0.02;
      if(o.type!=='tree' && air) continue;
      if(G.inv>0) continue;
      o.hit=true; stumble();
      if(G.state!=='run') break;
    }
    if(G.dist>=G.L.goal) winLevel();
    if(G.level===5) G.moonR=W*0.05+W*0.25*Math.max(0,(G.dist/G.L.goal-0.6)/0.4);
    hudGame();
  } else if(G.state==='caught'){ G.dark=Math.min(1,G.dark+0.9*dt); }
  else if(G.state==='finale'){ G.moonR=Math.min(W*0.8,G.moonR+W*0.5*dt); G.wy=Math.max(H*0.15,G.wy-H*0.35*dt); }
  drawGame(G);
  G.raf=requestAnimationFrame(stepGame);
}
function spawnObstacles(){
  const W=G.W, n=Math.random()<0.25+0.08*G.level?2:1, used=[];
  for(let i=0;i<n;i++){
    const r=Math.random(), type= r<0.42?'tree': r<0.62?'rock': r<0.8?'hole':'log';
    let x, tries=0; do{ x=W*(0.12+Math.random()*0.76); tries++; } while(used.some(u=>Math.abs(u-x)<W*0.32) && tries<10);
    used.push(x);
    const o={type,x,y:-60,hit:false};
    if(type==='tree') o.r=W*(0.07+Math.random()*0.03);
    if(type==='rock') o.r=W*0.04;
    if(type==='hole') o.r=W*0.055;
    if(type==='log'){ o.w=W*(0.28+Math.random()*0.12); o.h=W*0.05; o.x=Math.max(o.w/2+4,Math.min(W-o.w/2-4,x)); }
    G.obs.push(o);
  }
}
function stumble(){
  const g=gameState();
  g.lives=Math.max(0,(g.lives||0)-1);
  G.lives--; G.inv=1.4; G.slow=0.6; G.dark=Math.min(0.34,G.dark+0.2); chime('try'); save(); hudGame();
  if(G.lives<=0){ G.state='caught'; hush(); say(['Oh no! The darkness caught you, and you turned back into a human!'],{noRemember:true});
    setTimeout(()=>{ if(G && G.state==='caught') gameMenu(`<h2>🧍 The darkness caught you!</h2><p>You turned back into a human.</p>`); },2200); }
}
function winLevel(){
  const g=gameState(), lv=G.level;
  if(lv<5){ G.state='won'; g.levelMax=Math.max(g.levelMax||1,lv+1); save(); chime('full');
    say([`Level ${lv} complete! Well done!`],{noRemember:true});
    gameMenu(`<h2>🎉 Level ${lv} complete!</h2><p>Level ${lv+1}, ${LEVELS[lv].name}, is open.</p>`); }
  else { G.state='finale'; g.moonReached=(g.moonReached||0)+1; save(); chime('full');
    say(['You reached the moon! Owooooo!'],{noRemember:true});
    setTimeout(()=>{ if(G) gameMenu(`<h2>🌕 You reached the moon!</h2><p>Owooooo! The wolf is safe in the moonlight for ever.</p>`); },2600); }
}
function drawWolf(ctx,x,y,W,t,jump,alpha){
  const s=1+0.38*Math.sin(Math.PI*Math.min(1,Math.max(0,jump/JUMP)));
  const u=W*0.04*s, ph=Math.sin(t*16);
  ctx.save(); ctx.globalAlpha=0.35; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(x+(s-1)*18, y+(s-1)*22+4, W*0.03, W*0.055, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.globalAlpha=alpha; ctx.translate(x,y);

  ctx.save(); ctx.rotate(Math.sin(t*9)*0.35); ctx.fillStyle='#7C8796'; ctx.beginPath(); ctx.ellipse(0,u*2.4,u*0.38,u*1.1,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#E9EDF1'; ctx.beginPath(); ctx.ellipse(0,u*3.2,u*0.22,u*0.35,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  ctx.fillStyle='#9AA5B4'; ctx.beginPath(); ctx.ellipse(0,0,u*0.95,u*1.85,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#7C8796'; ctx.beginPath(); ctx.ellipse(0,u*0.2,u*0.45,u*1.3,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#9AA5B4'; ctx.beginPath(); ctx.arc(0,-u*2.05,u*0.85,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#E9EDF1'; ctx.beginPath(); ctx.ellipse(0,-u*2.75,u*0.38,u*0.55,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#22323B'; ctx.beginPath(); ctx.arc(0,-u*3.2,u*0.16,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#6F7D8A'; [-1,1].forEach(sx=>{ ctx.beginPath(); ctx.moveTo(sx*u*0.35,-u*2.3); ctx.lineTo(sx*u*0.95,-u*1.5); ctx.lineTo(sx*u*0.2,-u*1.7); ctx.closePath(); ctx.fill(); });
  ctx.fillStyle='#E8A33B'; [-1,1].forEach(sx=>{ ctx.beginPath(); ctx.arc(sx*u*0.34,-u*2.35,u*0.12,0,Math.PI*2); ctx.fill(); });
  ctx.restore();
}
function drawHuman(ctx,x,y,W){
  const u=W*0.03; ctx.save(); ctx.translate(x,y); ctx.rotate(0.3);
  ctx.fillStyle='#2E7F86'; ctx.fillRect(-u*0.9,-u*1.2,u*1.8,u*2.2);
  ctx.fillStyle='#F1DDAE'; ctx.fillRect(-u*0.8,u*1,u*0.7,u*2); ctx.fillRect(u*0.1,u*1,u*0.7,u*2);
  ctx.fillStyle='#B9805A'; ctx.beginPath(); ctx.arc(0,-u*1.9,u*0.75,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#5B3A1E'; ctx.beginPath(); ctx.arc(0,-u*2.1,u*0.78,Math.PI,0); ctx.fill();
  ctx.fillStyle='#B9805A'; ctx.fillRect(-u*1.6,-u*1,u*0.6,u*1.6); ctx.fillRect(u*1,-u*1,u*0.6,u*1.6);
  ctx.restore();
}
function drawGame(g){
  const {ctx,W,H}=g;
  ctx.fillStyle=g.L.bg; ctx.fillRect(0,0,W,H);
  g.decor.forEach(d=>{ if(d.k==='flower'){ ctx.fillStyle='#F4D26B'; ctx.beginPath(); ctx.arc(d.x,d.y,d.r*0.6,0,Math.PI*2); ctx.fill(); }
    else { ctx.strokeStyle='rgba(120,180,120,.25)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(d.x-d.r,d.y); ctx.lineTo(d.x,d.y-d.r*1.6); ctx.lineTo(d.x+d.r,d.y); ctx.stroke(); } });
  // the moon ahead
  ctx.save(); const mg=ctx.createRadialGradient(W/2,-W*0.02,0,W/2,-W*0.02,g.moonR*2.2); mg.addColorStop(0,'rgba(255,244,200,.55)'); mg.addColorStop(1,'rgba(255,244,200,0)');
  ctx.fillStyle=mg; ctx.fillRect(0,0,W,H*0.5); ctx.fillStyle='#F4D26B'; ctx.beginPath(); ctx.arc(W/2,-W*0.02+g.moonR*0.4,g.moonR,0,Math.PI*2); ctx.fill(); ctx.restore();
  // obstacles
  g.obs.forEach(o=>{
    if(o.type==='tree'){ ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(o.x+6,o.y+8,o.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#1E5B34'; ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#2E7A47'; ctx.beginPath(); ctx.arc(o.x-o.r*0.25,o.y-o.r*0.25,o.r*0.6,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#3E9B5B'; ctx.beginPath(); ctx.arc(o.x-o.r*0.35,o.y-o.r*0.35,o.r*0.25,0,Math.PI*2); ctx.fill(); }
    else if(o.type==='rock'){ ctx.fillStyle='#5E646C'; ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#9AA1AA'; ctx.beginPath(); ctx.arc(o.x-o.r*0.3,o.y-o.r*0.3,o.r*0.45,0,Math.PI*2); ctx.fill(); }
    else if(o.type==='hole'){ ctx.fillStyle='#4A3420'; ctx.beginPath(); ctx.ellipse(o.x,o.y,o.r*1.15,o.r*0.85,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#050505'; ctx.beginPath(); ctx.ellipse(o.x,o.y,o.r,o.r*0.7,0,0,Math.PI*2); ctx.fill(); }
    else { ctx.fillStyle='#6B4423'; ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h,o.h/2); else ctx.rect(o.x-o.w/2,o.y-o.h/2,o.w,o.h); ctx.fill();
      ctx.fillStyle='#A0703F'; ctx.beginPath(); ctx.ellipse(o.x+o.w/2-o.h*0.4,o.y,o.h*0.35,o.h*0.45,0,0,Math.PI*2); ctx.fill(); }
  });
  // moonlight around the wolf
  const lg=ctx.createRadialGradient(g.x,g.wy,0,g.x,g.wy,W*0.45); lg.addColorStop(0,'rgba(210,225,255,.20)'); lg.addColorStop(1,'rgba(210,225,255,0)');
  ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);

}

/* =================== Sayings (expressions and phrases) ===================
   phrases.txt: id|saying|meaning|example|note. One comes up every 15 words; all are on the Sayings page.
   She guesses, taps "Show me", then "I knew it" or "New to me": either way it goes in her collection. */
const PHRASES=PHRASERAW.split(String.fromCharCode(10)).map(l=>l.trim()).filter(l=>l&&l[0]!=='#').map(l=>{ const f=l.split('|'); return {id:f[0],phrase:f[1],meaning:f[2],example:f[3]||'',note:f[4]||''}; });
const got=()=>state.sayings||(state.sayings={});
const nextPhrase=()=>PHRASES.find(p=>!got()[p.id])||null;
function sayingsTier(){ const n=Object.keys(got()).length, t=PHRASES.length; return n>=t?3 : n>=Math.ceil(t*0.6)?2 : n>=5?1 : 0; }
let phraseFrom='flow';
function startPhrase(P, from){
  if(!P) return;
  stopGame(); clearTimers(); hush(); phraseFrom=from||'flow';
  cur={phrase:P, shown:false}; view='phrase'; render(); window.scrollTo(0,0);
  say(['Here is a saying.', {pause:400}, P.phrase+'.', {pause:500}, 'What do you think it means?']);
}
function phraseLines(P){ const out=[`It means: ${P.meaning}.`, {pause:500}, `For example: ${P.example}`]; if(P.note) out.push({pause:500}, P.note); return out; }
function renderPhrase(){
  const P=cur.phrase, have=got()[P.id];
  stage.innerHTML=`<section class="stage"><span class="tag">💬 Saying</span>
    <h2 class="phrasebig">“${esc(P.phrase)}”</h2>
    ${cur.shown?`<div class="deep lesson"><p><b>It means:</b> ${esc(P.meaning)}.</p><p><i>${esc(P.example)}</i></p>${P.note?`<p class="hint">${esc(P.note)}</p>`:''}</div>
      <div class="row center"><button class="soft" type="button" id="pagain">🔊 Hear it again</button></div>
      ${phraseFrom==='sayings'&&have?`<button class="big" type="button" id="pback">Back to my sayings ➜</button>`:`<div class="row center"><button class="sure" type="button" id="pknew">I knew it ✓</button><button class="again" type="button" id="pnew">New to me ✨</button></div>`}`
    :`<p class="ask">What do you think it means?</p><div class="row center"><button class="soft" type="button" id="pagain">🔊 Hear it</button><button class="big" type="button" id="pshow">Show me 👀</button></div>`}
  </section>`;
  const again=$('#pagain'); if(again) again.onclick=()=>say(cur.shown?[P.phrase+'.',{pause:400}].concat(phraseLines(P)):[P.phrase+'.'],{noRemember:true,need:true});
  const show=$('#pshow'); if(show) show.onclick=()=>{ cur.shown=true; render(); say(phraseLines(P)); };
  const done=known=>{ got()[P.id]={known:known?1:0, at:Date.now()}; save(); chime('good');
    toast(`💬 Saying collected: ${Object.keys(got()).length} of ${PHRASES.length}`);
    if(phraseFrom==='sayings'){ view='sayings'; render(); } else nextOne(false); };
  const k=$('#pknew'); if(k) k.onclick=()=>done(true);
  const n=$('#pnew'); if(n) n.onclick=()=>done(false);
  const b=$('#pback'); if(b) b.onclick=()=>{ hush(); view='sayings'; render(); };
}
let sayingsFrom='start';
function openSayings(from){ stopGame(); clearTimers(); hush(); sayingsFrom=from||'start'; view='sayings'; render(); window.scrollTo(0,0); }
function renderSayings(){
  const g=got(), n=Object.keys(g).length, tier=sayingsTier();

/* How to get a nicer voice on each kind of device (the standalone site only has the device's own voices). */
function betterVoiceTips(){
  const ua=navigator.userAgent||'';
  const android=/Android/i.test(ua), apple=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/i.test(ua)&&navigator.maxTouchPoints>1), mac=/Macintosh/i.test(ua)&&!apple, edge=/Edg\//.test(ua);
  const tips=[];
  if(android) tips.push('<b>Android:</b> open Settings, search “Text-to-speech”, choose <i>Speech Services by Google</i>, tap ⚙ › Install voice data › English (United Kingdom or Australia), and download a voice. Then close and reopen this page and pick it here.');
  if(apple) tips.push('<b>iPhone or iPad:</b> Settings › Accessibility › Spoken Content › Voices › English. Download one marked <i>Enhanced</i> or <i>Premium</i>, then reopen this page.');
  if(mac) tips.push('<b>Mac:</b> System Settings › Accessibility › Spoken Content › System voice › Manage Voices. Download one marked <i>Premium</i>, then reopen this page.');
  if(!android && !apple && !edge) tips.push('<b>Computer:</b> Microsoft Edge has the most natural voices (their names say “Natural” or “Online”). Open this page in Edge to use them.');
  if(edge) tips.push('Voices with “Natural” or “Online” in the name sound the most like a real person.');
  return `<details class="vtips"><summary>Get a nicer voice</summary>${tips.map(t=>`<p>${t}</p>`).join('')}</details>`;
}
/* Backup codes: every name's progress in one piece of text, to move between devices or browsers. */
let restoreArmed=null;
async function backupCode(){
  persistLocal();
  const all=players.map(p=>({id:p.id, name:p.name, state:p.id===who?state:lsGet(STORE+':'+p.id,null)}));
  /* Names played on another device may only be in Claude's saving: fetch the newer copy from there. */
  if(db && uid){ for(const x of all){ if(x.id===who) continue;
    try{ const snap=await timeout(db.doc(profilePath(x.id)).get(), 6000); if(snap.exists){ const r=migrate((snap.data()||{}).state); if(r && (!x.state || (r.updatedAt||0)>(x.state.updatedAt||0))) x.state=r; } }catch(e){} } }
  for(let i=all.length-1;i>=0;i--) if(!all[i].state) all.splice(i,1);
  const json=JSON.stringify({app:'word-moon', v:1, at:Date.now(), players:all});
  return 'WORDMOON1:'+btoa(unescape(encodeURIComponent(json)));
}
function readBackup(code){
  const m=String(code||'').replace(/\s+/g,'').match(/WORDMOON1:([A-Za-z0-9+\/=]+)/); if(!m) return null;
  try{ const d=JSON.parse(decodeURIComponent(escape(atob(m[1])))); return d && Array.isArray(d.players) && d.players.length ? d : null; }catch(e){ return null; }
}
function loadBackup(d){
  let n=0;
  d.players.forEach(p=>{ const st=migrate(p.state); const name=String(p.name||'').trim().slice(0,30); if(!st||!name) return;
    let ex=players.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!ex){ let id=slugName(name), k=2; while(players.some(x=>x.id===id)) id=slugName(name)+'-'+(k++); ex={id,name}; players.push(ex); }
    lsSet(STORE+':'+ex.id, st); n++;
    if(ex.id===who){ state=st; } });
  lsSet(NAMES_KEY,players);
  if(who){ loadLocal(who); save(); }
  return n;
}
function bkShow(txt){ $('#bkBox').innerHTML='<textarea readonly></textarea>'; const t=$('#bkBox textarea'); t.value=txt; t.focus(); t.select(); $('#bkMsg').textContent='Select all and copy.'; }
function showBox(txt){ $('#copyBox').innerHTML='<textarea readonly></textarea>'; const t=$('#copyBox textarea'); t.value=txt; t.focus(); t.select(); $('#copied').textContent='Select all and copy.'; }
function progressText(){
  const c=pileCounts();
  const lines=["Luna's Word Moon progress ("+new Date().toLocaleDateString()+")", PILES.map((p,i)=>p.n+': '+c[i]).join(' | ')];
  [3,2,1].forEach(i=>{ const l=AW().filter(e=>phaseOf(e.w)===i).map(e=>{ const r=state.words[e.w]; return e.w+(i===1?(r.read?' (reads)':' (knows)'):''); }); if(l.length) lines.push(PILES[i].n+': '+l.join(', ')); });
  return lines.join('\n');
}
function openGrown(){ clearTimers(); hush(); afterGrown={view}; resetArmed=false; view='grown'; render(); window.scrollTo(0,0); }
function resumeWord(){ /* carry on with a fresh step for the same word */
  view='word'; const r=rec(cur.w);
  const step = sess.mode==='spell' ? (r.spell?null:'spell') : cur.full ? (cur.step||'readcheck') : !r.read ? 'readcheck' : !r.know ? 'know' : !r.spell ? 'spell' : null;
  if(step==='readtest'||step==='knowcheck'||step==='explain') return goStep(step==='readtest'?'readcheck':'know');
  if(step) goStep(step); else nextOne();
}
function closeGrown(){
  const a=afterGrown||{view:'start'}; afterGrown=null;
  if(a.view==='word' && sess && cur) return resumeWord();
  if(a.view==='cloud' && sess && cur && cur.cloud){ view='cloud'; return render(); }
  if(a.view==='end' && sess){ view='end'; render(); return; }
  if(a.view==='words'){ view='words'; render(); return; }
  if(a.view==='badges'||a.view==='lesson'){ view=a.view==='lesson'&&cur&&cur.lesson?'lesson':'badges'; render(); return; }
  view=who?'start':'who'; render();
}

/* hold to open (stops her opening it by accident); Enter or Space also opens it */
(function(){
  const b=$('#grownBtn'), fill=$('#grownFill'); let t0=0, raf=0;
  const stop=()=>{ cancelAnimationFrame(raf); t0=0; fill.style.width='0'; };
  const step=()=>{ const p=Math.min(1,(performance.now()-t0)/1200); fill.style.width=(p*100)+'%'; if(p>=1){ stop(); if(view!=='grown') openGrown(); } else raf=requestAnimationFrame(step); };
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); t0=performance.now(); raf=requestAnimationFrame(step); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('click',e=>{ if(e.detail===0 && view!=='grown') openGrown(); });
  b.addEventListener('contextmenu',e=>e.preventDefault());
})();
$('#hearBtn').onclick=()=>{ if(!cur) return; if(cur.step==='readtest' && !cur.answered) sayOptions(); else if(lastLines.length) say(lastLines,{noRemember:true,need:true}); };
$('#stopBtn').onclick=hush;
$('#exitBtn').onclick=()=>{ hush(); clearTimers(); if(sess) finishRound(); else { view='start'; render(); } };
$('#wordsBtn').onclick=()=>openWords(view);

document.addEventListener('keydown',ev=>{ if(view==='words' && popWord && ev.key==='Escape'){ ev.preventDefault(); closePop(); } });
/* keyboard: letters while spelling; Enter checks; 1-3 picks a dot */
document.addEventListener('keydown',ev=>{
  if(view!=='word'||!cur||ev.ctrlKey||ev.metaKey||ev.altKey) return;
  if(ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
  if(cur.step==='spell' && cur.spellPhase==='type' && !cur.spellResult){
    if(ev.key==='Backspace'){ ev.preventDefault(); typeKey('back'); return; }
    if(ev.key==='Enter'){ ev.preventDefault(); checkSpell(); return; }
    if(/^[a-zA-Z]$/.test(ev.key)){ ev.preventDefault(); typeKey(ev.key.toLowerCase()); }
    return;
  }
  if(cur.step==='readtest'){ const n=+ev.key; if(n>=1&&n<=3){ ev.preventDefault(); answerRead(n-1); } }
});

/* Big words shrink to fit on one line (no letters spilling onto the next line). */
function fitBig(){
  document.querySelectorAll('.bigword:not(.ghost)').forEach(el=>{
    el.style.fontSize='';
    let fs=parseFloat(getComputedStyle(el).fontSize), n=0;
    while(el.scrollWidth>el.clientWidth+1 && fs>18 && n<40){ fs*=0.92; el.style.fontSize=fs+'px'; n++; }
  });
  document.querySelectorAll('.bigword.ghost').forEach(el=>{ const prev=el.previousElementSibling; });
}
new MutationObserver(()=>{ requestAnimationFrame(fitBig); }).observe(document.body,{childList:true,subtree:true});
window.addEventListener('resize',()=>requestAnimationFrame(fitBig));
appReady=true;
if(!who) view='who';
render();
})();
